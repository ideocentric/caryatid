id: loa-hook-switch
kind: other
source_claim: >-
  loa's pin map assigns the hook switch to caryatid J8 -> D7 (SW3), through the
  74HC14 debouncer, on the assumption that the phone's hook is a plain
  mechanical switch: metal contacts, near zero ohm closed and open circuit on
  hook. That assumption has never been stated as an assumption, and until
  2026-08-31 nothing had been measured.
source_ref: >-
  loa docs/design/12-phone-build.md, "Mapping onto caryatid": "J8 -> D7 (SW3)
  hook switch, via the 74HC14 debouncer". Circuit per
  docs/decisions/0007-rc-and-schmitt-instead-of-the-ls18-p.md.
resource: >-
  The off-hook switch in loa's Bittel HA41T-25, and caryatid's SW3 input
status: conflict       # POLARITY CONTRADICTED 2026-08-31. Was briefly recorded confirmed; it is not.

the_circuit_it_has_to_drive:
  # ADR 0007. This is the thing the switch is being measured AGAINST, and it is
  # what turns a resistance into a pass or a fail.
  topology: >-
    3V3 -- 10 kohm pull-up -- NODE -- 10 kohm series -- 74HC14 input, with the
    debounce capacitor from that input to ground (1 uF for a hook lever). The
    switch closes the NODE to ground. No current flows in the series 10 kohm,
    since a CMOS input draws none, so the node sits at a plain divider between
    the 10 kohm pull-up and whatever the switch actually is.
  node_voltage: 3.3 * Rswitch / (10000 + Rswitch)
  thresholds_74hc14_at_3v3: >-
    INTERPOLATED. The datasheet specifies 2.0 / 4.5 / 6.0 V and not 3.3 V.
    VT+ typical ~1.7 V, worst case as high as ~2.3 V.
    VT- typical ~1.0 V, worst case as low as ~0.7 V.
    Design to the worst case, not the typical.

acceptance:
  # THE THRESHOLD THIS RECORD EXISTS TO STATE. The keypad question sat open for
  # weeks because it was carried as "beep it out" with no number attached.
  closed_resistance:
    guaranteed_below_ohm: 2690     # node <= 0.7 V, under worst-case VT-
    typical_below_ohm: 4350        # node <= 1.0 V, under typical VT-
    rationale: >-
      Against a 10 kohm pull-up on 3V3, the switch must be a small fraction of
      10 kohm to pull the node under the Schmitt's lower threshold. A genuine
      metal contact at well under 100 ohm clears this by two orders of
      magnitude and no one need think about it again.
  open_resistance: >-
    Anything above roughly 1 Mohm is fine. The node reaches 3.30 V at the
    37 Mohm measured, which is logic high with no margin worth discussing.

measured_2026_08_31:
  what_was_probed: >-
    THE CABLE running from the off-hook switch on the phone's LARGE BOARD to a
    separate board. NOT the switch contacts themselves.
  off_hook_ohm: 27000
  on_hook_ohm: 37000000

  🔴 THE_ABSOLUTE_VALUES_ARE_NOT_RELIABLE: >-
    MATT, 2026-08-31: "the readings can be off due to the challenge of the
    connection to take the reading." Probing was awkward and the contact was
    poor. So 27 kohm and 37 Mohm are NOT usable figures and nothing should be
    decided from them numerically.

    ONE THING SURVIVES, AND IT IS LOGIC RATHER THAN PRECISION: a poor probe
    connection can only ADD series resistance, never remove it. So 27 kohm is
    an UPPER BOUND on the true closed resistance. The real value is at or below
    it, possibly far below. That does not clear acceptance (2.69 kohm) but it
    does mean the failure analysis below describes the worst conceivable case
    rather than the likely one.

  🔴 POLARITY_IS_IN_CONFLICT_AND_MUST_NOT_BE_STATED_AS_FACT: >-
    RAISED 2026-08-31, within an hour of being recorded as confirmed. Two
    statements from Matt on the same day, and they are opposites:

      A, earlier: "the telephone spring switch is normally closed and when
         pressed it's open." Handset down presses it.
         => ON HOOK = OPEN, OFF HOOK = CLOSED.

      B, later:  "When the hand set is down (on Hook), the phone switch is
         engaged connecting the switch."
         => ON HOOK = CLOSED, OFF HOOK = OPEN.

    THE MEASUREMENTS SUPPORT A. Off hook read 27 kohm, conductive; on hook read
    37 Mohm, effectively open. But those readings were withdrawn as unreliable
    because of poor probe contact, and a probe that slipped on the on-hook
    reading would produce exactly 37 Mohm from a genuinely CLOSED switch. So
    the measurement leans toward A without settling it.

    B MAY NOT BE A CONTRADICTION AT ALL. "Engaged" is ambiguous: it reads as
    the MECHANICAL sense, the resting handset engaging the plunger, which is
    true under BOTH A and B and says nothing about the circuit. "Connecting the
    switch" then reads as electrical. If B meant only that the handset engages
    the mechanism, A stands untouched. This is a wording question, not
    necessarily a factual one, and it is being flagged rather than guessed.

    A PART LINK WAS SUPPLIED, an Amazon listing for a generic telephone hook
    switch, B0CP269PT2. NOT FETCHED: the request returned HTTP 500. It would
    have been weak evidence regardless, since a visually similar aftermarket
    part is not the part in this phone and marketplace listings rarely state
    contact configuration reliably. It is recorded as a pointer, not a source.

  🔴 WHY_THIS_IS_NOT_A_DETAIL: >-
    THE FAIL-SAFE ARGUMENT INVERTS WITH IT. ADR 0007 chose the inverted output
    because a broken lead reads as switch-open, which it assumed meant on-hook
    and therefore silent.

      IF A:  broken lead -> open -> ON HOOK  -> silent, mic bias off. SAFE.
      IF B:  broken lead -> open -> OFF HOOK -> LIVE, MIC HOT. The exact
             failure ADR 0007 says it chose this polarity to avoid.

    Under B the ADR's stated rationale does not hold for loa and something has
    to change: take the other contact set if the switch has one, invert in the
    harness, or accept a broken lead bringing the instrument up live.

  the_polarity_claim_that_was_briefly_recorded_confirmed: >-
    THE HOOK IS A TELEPHONE SPRING SWITCH, NORMALLY CLOSED. Pressed, it opens.
    The handset resting in the cradle is what presses it. Therefore:

        handset ON hook  (resting, spring pressed)   -> switch OPEN
        handset OFF hook (lifted,  spring released)  -> switch CLOSED

    The two readings corroborate this directionally even though neither value
    is trustworthy: off hook read low (27 kohm), on hook read effectively open
    (37 Mohm). Direction is robust to bad probe contact in a way magnitude is
    not, which is why this is the part worth keeping.

  🔴 THIS_CONFIRMS_ADR_0007_RATHER_THAN_THREATENING_IT: >-
    ADR 0007 argues the inverted polarity is the safe one: "an unplugged cable
    reads identically to switch open, for loa that means on-hook, so a broken
    lead leaves the instrument silent with the mic bias off." THAT ARGUMENT
    RESTED ON AN UNSTATED ASSUMPTION, that on-hook is the open state. It is now
    measured, and it holds.

    The full chain, end to end:
        on hook   -> spring pressed -> switch OPEN   -> node pulled to 3V3
                  -> 74HC14 in HIGH -> D7 LOW        -> silent, mic bias off
        off hook  -> spring free    -> switch CLOSED -> node pulled to GND
                  -> 74HC14 in LOW  -> D7 HIGH       -> live
        broken lead                 -> looks OPEN    -> D7 LOW -> silent
    Firmware reads D7 HIGH as off-hook. 12-phone-build.md already says "switch
    closed is high", and that is correct as written.

  a_bonus_for_a_battery_instrument: >-
    ADR 0007 flags that each CLOSED switch draws 330 uA through its pull-up and
    warns it "is not zero on a build with latching switches that sit closed".
    LOA'S HOOK SITS OPEN AT REST, because at rest the handset is down. So the
    330 uA is drawn only while the instrument is actually in use, and the idle
    draw is nil. The ADR's concern does not apply to this channel.

  as_measured_it_would_FAIL_if_the_number_were_real: >-
    27 kohm against the 10 kohm pull-up puts the node at 2.41 V. That is ABOVE
    even the worst-case VT+ of ~2.3 V, so the 74HC14 input never leaves logic
    high and THE HOOK NEVER REGISTERS AS CLOSED. Not marginal, not a debounce
    problem: roughly 8x too high, and it would present as a completely dead
    hook switch with every other part of the instrument working.

  🔴 but_the_switch_is_almost_certainly_not_27_kohm: >-
    THIS IS PROBABLY NOT A MEASUREMENT OF THE SWITCH. Two things say so:
      - A mechanical hook lever is metal contacts. Closed, it should read
        essentially zero, not 27 kohm.
      - On-hook read 37 Mohm rather than open circuit. A genuinely open pair of
        contacts reads OL. A finite tens-of-megohm figure is leakage through a
        semiconductor or a board, which means something is in the path.
    Probed through a cable into a separate board, the reading is the switch in
    series or parallel with whatever that board puts across it. THE SAME SHAPE
    AS THE HOT-MELT GLUE ON THE CAPSULE AND THE BEEPER ON THE KEYPAD: the setup
    is reporting itself rather than the part.

  and_it_may_not_matter_at_all: >-
    LOA REPLACES THE PHONE'S MAINBOARD. Whatever network produced 27 kohm is
    scrap. caryatid wires to the switch contacts directly, exactly as the keypad
    was reached at its own header rather than through the mainboard. If the
    contacts are metal, the question closes at zero cost.

the_next_measurement:
  # NARROWED 2026-08-31. Polarity is settled and is no longer part of this.
  # One number is wanted and nothing else.
  what: >-
    THE CLOSED RESISTANCE OF THE SPRING CONTACTS, to usable precision. Cable
    disconnected at BOTH ends, probed at the switch terminals on the large
    board, with a connection good enough to trust. Handset LIFTED, since that
    is the closed state.
  get_a_good_contact_this_time: >-
    The awkward connection is what made the last reading unusable. Clip rather
    than hold, and read the meter's own lead resistance first by shorting the
    probes, so the switch figure is the switch and not the leads. At a 2.69
    kohm threshold a couple of ohms of lead is irrelevant, but tens of kilohm
    of bad contact is exactly what happened.
  expect: >-
    Near zero ohm off-hook, open circuit on-hook. That clears acceptance by two
    orders of magnitude and this record closes `confirmed`.
  if_it_still_reads_tens_of_kohm: >-
    Then it is not a plain mechanical switch. Candidates worth checking before
    redesigning anything: an optical interrupter (a phototransistor conducting
    at tens of kohm is exactly this shape), a Hall sensor, or a switch fitted in
    series with a resistor on the same board. Identify it before choosing a fix.
  🔴 polarity_MUST_be_re-measured: >-
    It was briefly recorded as settled and it is not. THE DECISIVE TEST, and it
    takes ten seconds once the meter is on the contacts:
      Cable off at both ends, probes clipped to the switch terminals, meter in
      resistance. PRESS THE PLUNGER BY HAND, which is what the resting handset
      does, and watch the meter. Note which state reads low. Pressed reading
      low means B and the fail-safe inverts. Pressed reading open means A and
      ADR 0007 stands.
    Watch the meter through the transition rather than taking two static
    readings, so a slipped probe shows up as noise instead of as an answer.

  also_count_the_terminals: >-
    HOW MANY TERMINALS DOES THE SWITCH HAVE? It decides whether B is a problem
    or a non-event.
      TWO  -> SPST. You get the polarity the switch gives you, and if it is B
              the fix has to happen in the harness or the firmware.
      THREE -> SPDT, common plus normally-open plus normally-closed. Then the
              polarity is a WIRING CHOICE, not a constraint: pick the contact
              that makes on-hook open, and ADR 0007's fail-safe holds for free.
    Telephone hook switches are commonly SPDT because the phone itself needs
    both senses. Check before treating B as a design problem.

if_the_reading_is_real:
  # Only if the contacts genuinely measure tens of kohm. Do not act on these yet.
  - >-
    RAISE THE PULL-UP. To put 27 kohm under 0.7 V the pull-up must exceed
    100 kohm, against the 10 kohm fitted. That is a resistor swap on caryatid,
    but it slows the RC and raises noise susceptibility on an unshielded panel
    lead, which is the specific thing ADR 0007 chose the RC to fix.
  - >-
    BYPASS THE PHONE'S SENSOR and fit a plain microswitch on the hook lever.
    Cheapest and most robust, and it makes the input a metal contact again.
  - >-
    Do NOT reach for a comparator or a transistor buffer before establishing
    what the sensor is. Three of the 74HC14's gates are spare but the ADR is
    explicit that they have nowhere to go on a frozen pin map.

the_phone_has_four_boards:
  # Recorded 2026-08-31, new structural context, not previously written down.
  boards:
    - keypad board, HA(41)T-25 KB T1, connector PX. See `loa-keypad-matrix`.
    - large board, carries the off-hook switch
    - a separate board the off-hook cable runs to
    - a fourth, not yet characterised
  note: >-
    Only the keypad board and the hook switch are wanted. The rest is the
    phone's line circuit and is replaced by caryatid. Worth knowing before
    anything is unsoldered.

evidence:
  - "2026-08-31: off-hook 27 kohm, on-hook 37 Mohm, measured on the CABLE from
     the off-hook switch on the large board to a separate board, not at the
     switch contacts. Against ADR 0007's 10 kohm pull-up on 3V3 this puts the
     node at 2.41 V, above the 74HC14's worst-case VT+ of ~2.3 V, so as
     measured the hook would never register. The finite 37 Mohm on-hook, where
     open contacts should read OL, indicates circuitry in the path and that the
     switch itself was not what was measured"
  - "2026-08-31: POLARITY IN CONFLICT, raised within the hour. Matt earlier:
     'normally closed and when pressed it's open' (on hook OPEN). Matt later:
     'when the hand set is down (on Hook), the phone switch is engaged
     connecting the switch' (on hook CLOSED). Opposites. The withdrawn readings
     lean toward the first. A supplied Amazon part link, B0CP269PT2, was not
     fetched: HTTP 500, and it would be weak evidence regardless. NOT RESOLVED,
     and the ADR 0007 fail-safe argument inverts depending on the answer"
  - "2026-08-31: SUPERSEDED BY THE CONFLICT ABOVE, kept per append-only.
     POLARITY CONFIRMED. The hook is a telephone spring switch,
     NORMALLY CLOSED, pressed open by the resting handset. So on-hook is OPEN
     and off-hook is CLOSED. This confirms the unstated assumption under ADR
     0007's fail-safe argument: a broken lead reads as open, reads as on-hook,
     leaves the instrument silent with the mic bias off. 12-phone-build.md's
     'switch closed is high' is correct as written"
  - "2026-08-31: THE ABSOLUTE VALUES ARE WITHDRAWN as unreliable, per Matt: the
     probe connection was awkward. 27 kohm survives only as an UPPER BOUND,
     since poor contact can only add series resistance. The closed resistance
     is still unmeasured to the precision the 2.69 kohm threshold needs"
  - "2026-08-31: the phone has FOUR boards. Keypad, a large board carrying the
     off-hook switch, a separate board the hook cable runs to, and a fourth not
     yet characterised"

last_verified: 2026-08-31

notes: >-
  THIS RECORD EXISTS TO PUT A NUMBER ON A CARRIED ASSUMPTION, which is the
  lesson `loa-keypad-matrix` was written for. "Hook switch via the 74HC14" was
  in 12-phone-build.md from the start and nobody had asked what resistance the
  74HC14 would accept. The answer, 2.69 kohm worst case, took one divider and
  should have been written down the day the pin was assigned.

  IT DOES NOT GATE THE BOARDS. caryatid is fabricated and SW3 is a general
  debounced input. It gates loa's wiring, and it gates it more sharply than the
  keypad did, because the failure mode is a hook that simply never responds.
