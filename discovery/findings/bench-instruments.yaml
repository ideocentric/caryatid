id: bench-instruments
kind: other
source_claim: >-
  Implicit in every measurement this project records: that the reader knows what
  the reading was taken with, and therefore what it can and cannot support. No
  record has ever said. `loa-keypad-matrix` carries resistances, `loa-hook-switch`
  carries a withdrawn pair of them, `bt1-cell-fit` carries a length, and none
  names an instrument.
source_ref: >-
  discovery/findings/*.yaml, none of which names an instrument; docs/bringup.md,
  which assumed an ammeter at steps 4.7 and 4.9 that does not exist.
resource: The bench instruments used for every measurement in this project
status: confirmed

instruments:
  multimeter:
    model: Fluke 101
    in_hand_since: before this project
    🔴 has_NO_current_ranges: >-
      NONE. Not a limitation of a range, an absence of the function. The 101 is
      the model in Fluke's line specifically without current measurement.
      EVERY CURRENT FIGURE IN THIS PROJECT IS THEREFORE A SHUNT VOLTAGE, or
      comes off the bench supply's own display.
    good_at: >-
      Millivolts. It resolves 0.1 mV on the 600 mV range, which is what makes
      the shunt method work well rather than merely work.
    🔴 ohms_gain_error_QUANTIFIED_2026_09_23: >-
      THE METER READS ~1.1% LOW ON RESISTANCE, ACROSS AT LEAST TWO RANGES.

          part             nominal   reads    low by    range
          2k2, 1% stated   2200      2174     1.18%     6 k
          1k               1000       990     1.00%     6 k
          120               120       118.7   1.08%     600

      🔴 IT IS THE TIGHTNESS THAT IS THE EVIDENCE, NOT THE DEVIATION. Three
      independent parts landing within 0.18% of each other is not what random
      parts do, whatever their tolerance band. And it spans the 600 ohm and
      6 k ranges, so it is a GAIN error rather than anything range-specific.

      CONSEQUENCE, closing a caveat open since the switch lamp: the 10.2 ohm
      shunt was read on the 600 ohm range, so its true value is nearer
      10.31 ohm and EVERY CURRENT DERIVED FROM IT IS ~1.1% LOW. Switch lamp
      28.2 mA rather than 28.5; the CC offset 3.49 rather than 3.53. All
      inside the few percent already recorded. NOTHING MOVES, but the caveat
      is now a number instead of a bound.

      ⚠️ STILL NOT A CALIBRATION. Three parts of unstated tolerance at three
      points. It is a consistent observation, not a correction factor, and it
      should not be applied silently to readings.

      ⚠️ A FOURTH POINT, 2026-09-25, THAT DOES NOT FIT THE 1.1% PATTERN. The
      board's +3V3A bias network is a nominal 100k (two 200k divider branches
      in parallel, R55/R56 and R59/R60, all 100k). Applying 1.1% predicted
      ~99k. MEASURED 99.5-99.9k ON ALL FIVE BOARDS, i.e. only 0.1-0.5% low.

      THIS CANNOT SEPARATE METER ERROR FROM PART TOLERANCE. Four 1% resistors
      combine to roughly 0.7% on the network, which spans the whole
      discrepancy. So it is EITHER a network running slightly high OR a meter
      more accurate on the 600k range than on the lower two. Both are
      consistent with the data and nothing here decides between them.

      ⇒ DO NOT EXTEND THE 1.1% FIGURE ABOVE THE 6k RANGE. It was measured on
      600 ohm and 6k and it is not supported at 600k.

    ohms_accuracy_first_actual_check_2026_09_22: >-
      A 1% 2k2 resistor READ 2174 OHM. A 1% part is 2178-2222, so the meter
      reads somewhere between 0.2% and 2.2% LOW on the 6.000 k range. That is
      the first time the ohms function has been checked against a known part
      in this project rather than trusted. SUPERSEDED by the three-point
      result above, which tightens it to ~1.1%.

      LEAD RESISTANCE DOES NOT EXPLAIN IT: leads ADD, pushing a reading high,
      and they measured 0.0 ohm the same week (under ~0.05 ohm, the display
      resolution).

      CONSISTENT WITH, and mildly supporting, the caveat recorded against the
      switch lamp: if the meter reads low on ohms generally then the 10.2 ohm
      shunt is really a shade more and the lamp current a shade UNDER 28.5 mA.
      Inside the few percent already stated there. No figure moves.

      ⚠️ ONE PART IS NOT A CALIBRATION. It bounds the error at one point on one
      range and cannot separate meter error from part error. Treat it as a
      sanity check that found nothing alarming, not as a correction factor.
    range_signature_worth_knowing: >-
      The number of decimals identifies the range, which has already resolved a
      unit ambiguity once. 600 ohm range gives one decimal (145.3), the 6.000 k
      range gives three (0.821, 1.798, 2.174). When a reading is reported
      without its unit, the decimal count says which range it came from.
    used_for: DC volts, resistance, diode test, continuity

  bench_supply:
    model: Jesverty, 0-30 V, 0-5 A
    ordered: 2026-09-06
    selected_because:
      - >-
        0-5 A AND NOT 0-10 A. The work sits at the bottom of the range, a
        100 mA limit and a 0.90-1.10 A charge current, and halving the span
        roughly doubles the relative accuracy there. The 10 A sibling was
        rejected for exactly this: a bigger number that is worse for the job.
      - >-
        SELECTABLE CC / OCP. Constant current holds the board powered at a safe
        current so a fault can be probed while it is misbehaving. OCP trips off,
        which tells you only that something is wrong, which is where the
        resistor ladder already was.
      - Encoder knob with coarse and fine, for dialling a low limit precisely.
    topology: switching
    topology_is_acceptable_here: >-
      There is no scope to see the noise, and the instrument runs from a battery
      and its own boost in service, so switching noise touches only bench
      measurements not yet being made. One second-order caveat: a switching
      supply's output capacitor dumps into a fault before CC can act, which
      slightly reduces the protection at first power-up. Milliseconds, and far
      better than no limit.
    🔴 CC_IS_OFFSET_measured_2026_09_23: >-
      real = set + 3.53 mA.  UNITY GAIN, FIXED OFFSET.

          set  2 mA -> 5.98 mA delivered   (+3.98)
          set  5 mA -> 8.53 mA delivered   (+3.53)
          set 10 mA -> 13.53 mA delivered  (+3.53)

      The 5 and 10 mA pair gives a slope of EXACTLY 1.000, which kills any
      gain-error model. Measured with the 10.2 ohm shunt and the Fluke on
      DC mV, every reading verified by A-B + B-C = A-C.

      🔴 TWO PERMANENT CONSEQUENCES:
        1. THE SUPPLY CANNOT DELIVER LESS THAN ~3.5 mA IN CC, whatever is
           set. That is the minimum-current answer, and it is a property of
           the instrument rather than a resolution limit.
        2. TO GET A CURRENT, SET IT 3.5 mA LOW. Want 20 mA, set 16.5.

      The floor is SOFT, not sharp: the 2 mA point ran +0.45 mA above the
      model and the current visibly wandered 5.2-6.8 mA there. Regulation
      is worse at the bottom as well as offset.

      ⚠️ PREFER CV WITH A MEASURED SERIES RESISTOR over CC for any small
      current. The resistor sets the current and its drop reports what you
      actually got, so the supply is only asked to be a stable voltage and
      its current circuitry never enters the measurement.

      WHAT IT EXPLAINS: a green die read 2.54-2.59 V at a set 2 mA against
      2.454 V at 2.57 mA under CV. Voltage up as current down, which a
      diode cannot do. It was never at 2 mA, it was at about 6 mA.

    voltage_display_reads_slightly_low: >-
      2.62 V displayed against 2.64-2.67 V on the Fluke across the same two
      nodes, 2026-09-23. Only 20-50 mV, and at the bottom of a 0-30 V range.
      Treat the supply's displays as convenience, the Fluke as the instrument.

    STILL_NOT_VERIFIED: >-
      Current SET RESOLUTION and the published accuracy specification. The
      Amazon listing's spec table could not be read and only the title was
      retrieved; the manual has not been checked. The CC offset above was
      measured rather than read, and supersedes the need for the minimum
      settable current limit.

  oscilloscope:
    model: "Seeed Studio DSO Nano"
    in_hand_since: 2026-09-23
    ⚠️ VERSION_AND_SPECS_NOT_VERIFIED: >-
      Which DSO Nano version this is has NOT been established and the manual has
      not been checked. The figures below are the general class, not read off
      this unit. Confirm before quoting them anywhere.
    approximate: {bandwidth: "~200 kHz analog", sampling: "~1 MSa/s", channels: 1}

    🔴 adequate_for_audio_and_that_is_not_a_compromise: >-
      Audio is 20 Hz to 20 kHz. ~200 kHz is about TEN TIMES the top of the band.
      For the mic path, the gain stage and J17's output this instrument is
      genuinely sufficient rather than a stopgap.

    🔴 NOT_adequate_for_the_boost: >-
      THE TPS61023 SWITCHES AT 1 MHz above 1.5 V VIN, dropping to 0.5 MHz below
      1 V. Read from the datasheet 2026-09-23, tps61023_SLVSF14B.pdf.

      ⚠️ THIS ENTRY SAID "AROUND 2 MHz" WHEN FIRST WRITTEN, FROM RECOLLECTION
      RATHER THAN THE DATASHEET. Corrected. THE CONCLUSION IS UNAFFECTED: ~200
      kHz cannot resolve 1 MHz either, being five times short rather than ten.
      The note under `bench_supply` that there is no scope to see the switching
      noise STILL STANDS and was deliberately not deleted when this scope
      arrived. A scope that cannot resolve the waveform is not a scope for that
      job.

    other_limits:
      single_channel: >-
        No simultaneous comparison of two signals: not L against R, not input
        against output. Fine for a steady tone, awkward for transients.
      vertical_sensitivity: >-
        A raw capsule signal near 10 mV is about one division at full
        sensitivity, which is marginal. MEASURE AT U4'S OUTPUT INSTEAD, where
        x101 puts it at 0.5-1.8 V and the reading is comfortable.
      no_absolute_acoustic_reference: >-
        It cannot give sensitivity in dBV/Pa. That needs a calibrated acoustic
        source, which is a different missing instrument and is still missing.

    🔴 what_it_UNBLOCKS: >-
      `mic-gain-budget`, whose own `what_would_close_it` asks for exactly this:
      "measure the op-amp output on a scope with each gain leg selected". It has
      been unverified since capture for want of the instrument.

      AND IT SIDESTEPS THAT RECORD'S CENTRAL ASSUMPTION RATHER THAN RESOLVING
      IT. The 94 dB SPL figure is unverified and sits at the START of the chain.
      Measuring U4's output while speaking into the handset measures the END of
      the chain, so the SPL never has to be known. Operating point, not property.

  shunts:
    - {value: "10 ohm", for: "lamp, quiescent, any current in the mA range"}
    - {value: "0.1 ohm", for: "charge and input current, around 1 A"}
  🔴 the_shunts_are_not_made_redundant_by_the_supply: >-
    THE SUPPLY READS AMPS WELL AND MILLIAMPS BADLY, and the division matters.

      around 1 A   READ IT OFF THE SUPPLY. On a 5 A range this is well inside
                   the instrument's accuracy, and it needs nothing in series.
      tens of mA   USE THE 10 OHM SHUNT. A typical bench supply spec at 15 mA
                   on a 5 A range gives an error comparable to the whole
                   quantity being measured. The Fluke across 10 ohm reads
                   150 mV at 0.1 mV resolution, which is not close.

    So the switch lamp measurement, the quiescent current and every small
    reading stay on the shunt. The charge current moves to the supply's display
    with the 0.1 ohm available as a cross-check.

  service_supply_is_separate: >-
    The 5 V 3 A wall adapter and the 5.5 x 2.1 panel jack stay: they are what
    the INSTRUMENT runs from through J1, not what the bench measures with. The
    bench supply replaces them only for bring-up. See
    `charger-input-voltage-thermal`.

what_this_record_is_for: >-
  PROVENANCE. A resistance means something different taken with clipped leads on
  a cleaned terminal than taken with hand-held probes through hot-melt glue, and
  this project has already been burned by exactly that twice: the capsule read
  high through glue, and the hook switch read 27 kohm through an awkward
  contact. Both readings were withdrawn.

  Naming the instrument is half of citing the source. The other half, what was
  probed and how, belongs in the evidence file for the measurement.

evidence:
  - "2026-09-23: A SEEED STUDIO DSO NANO IS IN HAND, the project's first
     oscilloscope. Version and specs NOT verified against the manual; the ~200
     kHz single-channel class figures are general rather than read off this
     unit. Adequate for audio, being about ten times the top of the band, and
     NOT adequate for the TPS61023's ~2 MHz switching, so the existing note that
     there is no scope for the boost noise stands. It unblocks mic-gain-budget,
     which has asked for a scope since capture"
  - "2026-09-23: THE SUPPLY'S CC IS OFFSET BY +3.53 mA WITH UNITY GAIN.
     Set 2 / 5 / 10 mA delivers 5.98 / 8.53 / 13.53 mA measured on the 10.2 ohm
     shunt; the 5-to-10 pair gives a slope of exactly 1.000. So the minimum
     deliverable CC current is about 3.5 mA whatever is set, and a wanted
     current must be set 3.5 mA low. The floor is soft: the 2 mA point ran
     +0.45 mA high and wandered 5.2-6.8 mA. This explains a green die reading
     2.54-2.59 V at a set 2 mA when CV said 2.454 V at 2.57 mA: it was never at
     2 mA. Also: the supply's voltage display reads 20-50 mV low against the
     Fluke (2026-09-23-cc-floor-and-green-vf.txt)"
  - "2026-09-23: OHMS GAIN ERROR QUANTIFIED at ~1.1% LOW across two ranges,
     from three parts: 2k2 reads 2174 (1.18%), 1k reads 990 (1.00%), 120 reads
     118.7 (1.08%). The tightness is the evidence rather than the deviation.
     Tightens the 2026-09-22 bound of 0.2-2.2%. Implies the 10.2 ohm shunt is
     nearer 10.31 and every current derived from it is ~1.1% low; nothing
     recorded moves (2026-09-23-cc-floor-and-green-vf.txt)"
  - "2026-09-22: FIRST ACTUAL CHECK OF THE OHMS FUNCTION against a known part.
     A 1% 2k2 read 2174 ohm, bounding the meter to 0.2-2.2% low on the 6 k
     range. Not a calibration: one part at one point, and it cannot separate
     meter error from part error. Lead resistance measured 0.0 ohm on
     2026-09-20 and cannot explain a low reading in any case, since leads add
     (2026-09-22-handset-capsule-polarity-and-current.txt)"
  - "2026-09-06: bench supply ordered, Jesverty 0-30 V 0-5 A with selectable
     CC/OCP and an encoder with coarse and fine adjustment, arriving same day.
     Chosen over the 0-10 A sibling because the work sits at the bottom of the
     range. Set resolution, accuracy and minimum settable limit are NOT yet
     verified: the listing's spec table could not be retrieved"
  - "2026-09-06: the Fluke 101 confirmed to have NO current ranges, by Matt.
     This is why docs/bringup.md steps 4.7 and 4.9 were rewritten as shunt
     voltages rather than ammeter readings"

last_verified: 2026-09-23

notes: >-
  ON ARRIVAL, three things go in the record and one goes in the runbook:
  set resolution, accuracy spec, minimum settable current limit; and Stage 2
  becomes a CC setpoint rather than a resistor ladder.
