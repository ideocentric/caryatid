id: JLC-BOM-sourcing
kind: sourcing
source_claim: >-
  docs/status.md stated "$5.24/board in components" with no record behind it.
  That figure is close to what the API's leastNumberPrice field gives and is not
  what the parts cost.
source_ref: docs/status.md, "Manufacturing readiness" section, before 2026-08-19
resource: >-
  The 36 distinct LCSC codes in local/fab/bom.csv, covering all 92 placed parts
  per board (32 DNP excluded by design).
status: confirmed

measured:
  distinct_codes: 36
  parts_per_board: 92
  library_split: {basic: 16, extended: 20}
  joints_per_board: {smt: 100, through_hole: 111}
  manualweld_codes: 8      # both Seed sockets, BT1, all 17 JST/IDC connectors
  lcsc_coverage: "92 of 92"

# Exact, from live price ladders with the correct band per order quantity and
# MOQ respected. BT1 uses its pre-order price, not the public ladder.
parts_cost_usd:
  qty_5:  {total: 62.42, per_board: 12.48}
  qty_10: {total: 119.90, per_board: 11.99}

pre_order:
  C5339083: {ref: BT1, per_board: 1, unit: 4.8616, note: "orderable despite API stock 0 / presale 0"}
  C2897383: {refs: [A1, A2], per_board: 2, unit: 0.338, stock: 1353}

# NOT measured. Published rates applied to the measured counts above; the PCB
# fab line is a flat placeholder and 150 x 90 mm is area-priced past the
# 100 x 100 tier. tools/cost_estimate.py isolates these in RATES / PCB_FAB.
owner_bought_usd:
  # Bought outside the JLC order. Recorded 2026-08-23; the cells figure is
  # Matt's actual Orbtronic order, the rest are catalogue prices.
  cells:   {qty: 5, total: 67.45, unit: 13.49, source: "Orbtronic, direct", status: ordered}
  holders: {qty: 5, total: 17.35, unit: 3.47,  source: "Digi-Key 3029216",  status: not_ordered}
  shunts:  {qty: 100, total: 2.47, unit: 0.0247, source: "Digi-Key S9001-ND", status: not_ordered,
            note: "30 consumed by five boards, $0.74 of the $2.47; the rest are spares"}
  total_for_five: 87.27
  excludes: "Digi-Key shipping, quoted at $8.49 ground"

true_total_usd:
  # What five boards ACTUALLY cost, as opposed to what estimated_total_usd says.
  qty_5: {total: 256.14, per_board: 51.23}
  jlc_only_qty_5: {total: 168.87, per_board: 33.77}
  understated_by: {usd: 87.27, percent: 52}

estimated_total_usd:
  qty_5:  {total: 168.87, per_board: 33.77}
  qty_10: {total: 248.81, per_board: 24.88}
  fixed_regardless_of_quantity: 68.00    # $8 setup + 20 Extended x $3

decision:
  build_quantity: 5
  assembly: full turnkey
  rationale: >-
    10 was costed and rejected for now. It would require changing the battery
    holder pre-order quantity, and the holder is the only long-lead item --
    everything else can be re-quoted at any quantity up to order time. The
    second five would cost $15.99/board against $33.77 for the first five,
    because $68 is fixed, so the option stays cheap if taken later.

evidence:
  - >-
    2026-08-18: all 36 codes fetched from JLC's cart API; stock checked against
    qty 5 -- 35 of 36 clear, BT1 the only short line, which the pre-order
    resolves. Price ladders read per code and the correct band selected per
    order quantity.
  - >-
    2026-08-18: Matt confirmed BT1 C5339083 orderable via pre-order at $4.8616.
    The public endpoint reports stock 0 AND canPresaleNumber 0 for it and is
    blind to the pre-order route. Second time an automated stock test has
    contradicted the human record and been wrong.
  - >-
    2026-08-19: full snapshot of all 36 codes saved --
    discovery/evidence/2026-08-19-jlc-parts-snapshot.json -- model, library
    type, stock, MOQ, assemblyModeBatch and the complete price ladder for each.
  - >-
    2026-08-19: joint counts re-derived from hardware/pcb/caryatid.kicad_pcb by
    tools/cost_estimate.py -- 100 SMT and 111 through-hole per board, split by
    assemblyModeBatch rather than assumed from footprint names.

  - >-
    2026-08-22: fab_package.py reported 124 of 127 parts covered, 3 without an
    LCSC number -- R43 and R44 (4k7) and R45 (3k), all R_0603_1608Metric, all
    made assembly-relevant by ADR 0010 rather than by any change of value. Both
    gaps closed against the live JLC catalogue
    (cart.jlcpcb.com getComponentDetail, the same endpoint verify_parts.py uses),
    not from recollection:
    C4211 = "0603WAF3001T5E, 100mW 3kOhm 75V Thick Film Resistor +/-1%
    +/-100ppm/C 0603", Basic library, stock 7,702,550 -- already named in
    docs/sourcing.md as matching R45 and already in the absonus order, so this
    confirms a stated fact rather than choosing a part.
    C23162 = "0603WAF4701T5E, 100mW 4.7kOhm 75V Thick Film Resistor +/-1%
    +/-100ppm/C 0603", Basic library, stock 28,020,142 -- a NEW SELECTION for
    R43/R44, made by me. No LCSC code for 4k7 was stated anywhere in the repo.
    It is the same Uniroyal 0603WAF...T5E series, Basic library, 1%, 100 mW as
    C4211 and the board's other resistors. C25900 was rejected on footprint: it
    is the same 4.7k 1% part in 0402, and these pads are 0603.

  - >-
    2026-08-23: C23162 (R43/R44, 4k7) CORROBORATED, and it is no longer a bare
    tooling choice. Matt asked it to be checked against the absonus order, which
    CANNOT confirm it: absonus carries only two resistors, R1 10k (C15401) and
    R2 3k (C4211), and no 4k7 at all
    (synths/daisy/ribbon-synth/hardware/pcb/absonus-v0.2/production/bom.csv).
    That is why C4211 was findable there and C23162 was not. The corroboration
    came from elsewhere: BABY-BORG ALREADY USES C23162 FOUR TIMES -- R3, R4, R5,
    R6, each 4.7kOhm on Resistor_SMD:R_0603_1608Metric, the identical value and
    footprint to caryatid's R43/R44
    (synths/daisy/baby-borg/pcb/baby-borg/baby-borg/baby-borg.kicad_sch and
    .kicad_pcb). Matt separately confirmed the part is stocked as a JLC BASIC
    part: https://jlcpcb.com/partdetail/23889-0603WAF4701T5E/C23162 -- the same
    manufacturer part number the catalogue query returned. NOT VERIFIED: whether
    baby-borg was ever ordered or assembled. No production BOM, gerber set or
    order record was found in that repo, only design files and dated backups, so
    this is prior USE of the code in a design of Matt's, not a proven purchase.

  - >-
    2026-08-23: the baby-borg corroboration for C23162 is WEAKER THAN THE ENTRY
    ABOVE IMPLIES, and the open question in it is now answered. Matt states
    baby-borg WAS NEVER ORDERED, and that this design supersedes it. So the four
    R3-R6 instances are not prior use in a board that shipped; they are the same
    commodity part chosen by the same person in an earlier design that never
    reached a fab, and they inherit whatever reasoning that choice had -- which
    is not independently recorded anywhere. Treat them as a consistency check,
    not as a second source. THE EVIDENCE FOR C23162 IS THEREFORE: the live JLC
    catalogue query of 2026-08-22, and Matt's confirmation of the Basic-library
    listing at https://jlcpcb.com/partdetail/23889-0603WAF4701T5E/C23162. Both
    are about the PART. Neither is about this board's use of it, and no prior
    order anywhere contains a 4k7. For a 4.7kOhm 1% 0603 pull-up that is
    sufficient -- the specification is the value, the tolerance and the
    footprint, all three confirmed -- but it is one source on the part and zero
    on the application, and it should not be described as three.

  - >-
    2026-08-23: CORRECTION to the entry above, which said "this design supersedes
    it". That is wrong and was my inference, not Matt's words. baby-borg is NOT
    superseded -- it is a PLANNED FUTURE CONSUMER of caryatid: an I2C link to a
    small lidar, an electret mic and flex sensors, housed inside a baby doll,
    with the control set still undetermined. That is the case ADR 0002 makes --
    caryatid scopes the choices already known so an instrument can defer the
    rest. Integration is explicitly deferred; loa and caryatid stand alone for
    now. What IS true from that entry: baby-borg was never ordered, so its four
    C23162 instances remain a consistency check rather than a second source.
  - >-
    2026-08-23: the absonus check re-run against the BUILT v0.2 board rather
    than only its production/bom.csv, since Matt noted v0.2 was the variation
    with I2C added and was built. Confirms the earlier finding and improves on
    it. absonus-v0.2.kicad_sch carries exactly TWO resistors -- R1 10k (C15401)
    and R2 3k (C4211) -- so there is no 4k7 in any prior order, and C23162 gains
    nothing here. THE REASON IS INFORMATIVE RATHER THAN AN ABSENCE: v0.2 does
    have I2C, as a Qwiic connector J1 (C160404), but fits NO pull-ups at all and
    relies on the sensor breakout's own. caryatid fits its own R43/R44 instead,
    per ADR 0010, which is why it needs a 4k7 and absonus never did.
    SEPARATELY, C4211/R45 IS NOW CORROBORATED PROPERLY. absonus-v0.2.kicad_pcb
    places R2 on Resistor_SMD:R_0603_1608Metric -- the same footprint caryatid
    uses for R45 -- so the code and the footprint pairing are both confirmed
    against a board that was actually fabricated. Note the schematic disagrees
    with its own board there, listing R_0201_0603Metric on R2; the PCB is what
    was built and the PCB matches. Not chased -- it is absonus's discrepancy,
    not caryatid's.

  - >-
    2026-08-23: QUALIFIER on the entry above, from Matt: absonus v0.2 IS NOT
    FULLY TESTED. It was fabricated, so what it corroborates is that C4211 was
    ordered against an R_0603_1608Metric footprint and the two were committed to
    hardware together -- a PACKAGE-LEVEL fact. It does NOT corroborate that the
    part behaves correctly in circuit, because the circuit has not been fully
    exercised. For R45 that distinction happens not to bite: the claim being
    supported is that a 3k 1% 0603 resistor fits an 0603 land pattern, which
    fabrication establishes and testing would add nothing to. It WOULD bite for
    anything whose correctness depends on behaviour rather than geometry -- a
    regulator, a codec, a ferrite -- and no part in this BOM should be justified
    by "absonus has it" on that basis alone.

  - >-
    2026-08-23: ACCESSORIES ADDED AS A THIRD SOURCING CATEGORY, after Matt
    caught at ordering time that six jumper shunts per board were unbought and
    unrecorded. They are not DNP and not self_fit. A self_fit part is on the BOM
    and pulled out of the assembly order; an accessory was never on the BOM,
    because it is not soldered to the board and a netlist cannot see it. That is
    how fab_package.py reported "ready" while a part the board does not work
    without appeared on no list at all. Shunts were discussed in six documents
    and sourced in none. Recorded in hardware/pcb/lcsc.yaml under `accessories:`
    with a per_board quantity, reported by fab_package.py, and written to
    local/fab/accessories.csv, which stays OUT of the fab zip for the same
    reason self-fit.csv does.
    JUMPER SHUNT = Sullins SPC02SYAN, Digi-Key S9001-ND: 2.54mm 2-position,
    CLOSED TOP, gold flash, 6.50mm tall, $0.0247 at qty 100, 947,077 in stock,
    verified against digikey.com 2026-08-23. Six per board for JP1-JP6.
    I FIRST RECOMMENDED THE GRIP VERSION AND WAS WRONG. TE 2-881545-2 has a
    finger tab, gold 30uin and stands 10.90mm. Matt rejected it: the board lives
    sealed inside a BUD CU-477, the jumpers are set once per capsule and not
    revisited, so the tab buys nothing and stands 4.40mm further into the loom
    where a cable can unseat it. The closed top also fully encloses the header's
    6mm pins. Gold flash is the right spec once insertion cycles are ruled out;
    30uin gold is durability against a stress this application never applies.
    Preci-Dip 999-19-220-00 is lower again at 5.00mm and was rejected on supply:
    8 units from a marketplace seller, 11 week manufacturer lead time.
    CELL = 18650 PROTECTED, one per board, ALREADY ORDERED by Matt direct from
    Orbtronic. The board silkscreens "PROTECTED CELL ONLY" beside BT1 and that
    is a requirement rather than advice: the bq24074 protects the charge path,
    not the cell, so over-discharge and short protection must come from the
    cell's own PCM. NOT VERIFIED: the exact Orbtronic model and capacity. The
    figures in docs/values.md assume 3000 mAh for both charge time at 1 A
    (0.33C) and runtime from ~2500 mAh usable down to 3.0 V. If the ordered cell
    is smaller those figures are wrong and should be regenerated, not left
    reading as though they were measured.

  - >-
    2026-08-23: BT1's ACTUAL SOURCE recorded here for the first time. This record
    carried only the JLC pre-order line, C5339083 at $4.8616, which is the option
    that was REJECTED. What is being bought is MPD BH-18650-PC via DIGI-KEY
    3029216 at $3.47, cheaper and immediate against JLC's 21-day pre-order. That
    was decided on 2026-08-20 and lived only in lcsc.yaml's self_fit note until
    now, so the ledger described a purchase that is not happening.
  - >-
    2026-08-23: OWNER-BOUGHT SPEND IS NOT IN THE COST TOTALS ABOVE, and the
    totals should not be read as a project cost. estimated_total_usd covers the
    JLC order only: $168.87 for five boards. Outside it, per five boards:
    BT1 holders 5 x $3.47 = $17.35 and jumper shunts, buy 100 at $0.0247 =
    $2.47, both Digi-Key, one shipment. Cells were bought separately direct from
    Orbtronic and their price is NOT RECORDED -- Matt ordered them and has not
    stated a figure. So the true five-board cost is at least $188.69 plus the
    cells and Digi-Key shipping, against the $168.87 this record reports.

  - >-
    2026-08-23: Matt gave the Orbtronic order as $67.45 for five cells, $13.49
    each. That closes the last unpriced line and the totals can finally be
    stated. FIVE BOARDS ALL IN ARE $256.14, or $51.23 a board: $168.87 to JLC,
    $67.45 of cells, $17.35 of holders and $2.47 of shunts, before Digi-Key
    shipping. estimated_total_usd reports $168.87 and $33.77 a board, so THE
    RECORDED FIGURE UNDERSTATES THE BUILD BY $87.27, OR 52%. Both numbers are
    now carried, the JLC one under its own name.
    THE CELL IS THE LARGEST SINGLE LINE PER BOARD at $13.49, more than the
    $12.48 of JLC parts that go on the board itself.
  - >-
    2026-08-23: THE BUILD-QUANTITY RATIONALE IS WEAKENED BY THE SAME OMISSION
    and should be re-read before it is relied on. It argued that ten was
    rejected "for now" because "the second five would cost $15.99/board against
    $33.77 for the first five, because $68 is fixed, so the option stays cheap
    if taken later". That marginal figure is JLC-only. The owner-bought parts
    have NO fixed-cost leverage at all: cells, holder and shunts are $17.11 a
    board whether you build five or fifty. The real marginal cost of a second
    five is $33.10 a board against $51.23 for the first five. Still cheaper,
    but 65% of the first-five cost rather than the 47% the rationale implies,
    and the saving is nearly all JLC setup rather than anything about the cells.
    The DECISION to build five is not disturbed; the reasoning quoted for it is.

last_verified: 2026-08-23

notes: >-
  THE API HAS TWO FIELDS THAT LOOK AUTHORITATIVE AND ARE NOT. leastNumberPrice
  reads $0.101 for the Seed socket and $0.7533 for BT1, against real ladder
  prices of $0.338 and $4.8616 -- it is not the transacted price, and the
  retired "$5.24/board" figure is roughly what you get by trusting it.
  assemblyComponentFlag is False on every part here including a Basic 0603
  resistor with 6.8M in stock, so it carries no information at all.

  assemblyModeBatch IS reliable and is the one field worth reading: it separates
  the SMT line from hand soldering. That distinction drives more than half the
  joints on this board and was invisible until it was checked.

  THE COST FIGURES ARE HALF EXACT AND HALF ESTIMATE, and the split matters more
  than the totals. Parts is exact and reproducible. Everything else is published
  rates applied to measured counts, with the PCB fab line the least trustworthy
  -- 150 x 90 mm is past JLC's 100 x 100 tier so it is area-priced, and nothing
  here models that formula. Do not quote the totals as though they were
  measured; run tools/cost_estimate.py --quote against the real number instead.

  WHAT IS STILL PENDING: the quote itself, blocked on the pre-ordered holders
  appearing in the JLC parts library. Two lines are most likely to be wrong --
  the PCB fab estimate, and whether the Extended loading fee is charged per
  unique part or per BOM line. That second one has been got backwards here
  before, and it moves the total by about $30.