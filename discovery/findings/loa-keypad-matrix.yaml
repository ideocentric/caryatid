id: loa-keypad-matrix
kind: other
source_claim: >-
  loa's pin map assigns J11's seven digital lines to a 4x3 keypad, "rows D0-D3,
  columns D4-D6. Seven lines exactly." That assumes the phone's original keypad
  is already matrix-wired in a 4x3 with seven conductors. It has never been
  checked, and the platform spec warns the assumption is not safe.
source_ref: >-
  loa docs/design/12-phone-build.md, "Mapping onto caryatid" table and
  "Still to take, with the phone open" item 1: "Where the keypad ribbon emerges,
  and whether it is already a matrix ... beep it out before assuming seven
  discrete lines."
resource: >-
  The original keypad in loa's telephone, and J11 on caryatid (IDC 2x5,
  D0-D6 + 3V3D + DGND + spare, 100 ohm series on each line)
status: confirmed           # the MATRIX, 2026-08-31. The `connector:` block below is
                            # now in CONFLICT and is NOT covered by this status.

the_measurement:
  what: >-
    For each of the 12 keys, which pair of ribbon conductors closes, and the
    resistance when closed.
  why_both: >-
    The pairs give the matrix map. The resistance decides whether the Seed's
    internal pull-up can read it, which the pair map alone does not tell you.
  how: >-
    Multimeter in RESISTANCE mode, keypad disconnected from the phone's board.
    Press one key at a time and probe conductor pairs until one reads closed.
    With nothing pressed, every pair should read open.

  🔴_do_not_use_the_continuity_BEEPER: >-
    Telephone keypads are usually conductive-rubber pills on carbon pads. A good
    key closes at hundreds of ohms to a few kilohm, NOT a dead short. A beeper
    that triggers below about 50 ohm will stay silent on a perfectly healthy key,
    and the wrong conclusion is "not a matrix" or "dead keypad". This is the same
    shape as the hot-melt glue on the capsule: the instrument's default setting
    hides the reading rather than reporting it.

  premise_did_not_hold: >-
    READ `result:` BEFORE THE BEEPER WARNING BELOW. Measured 2026-08-31, every
    key closes between 10.6 and 17.5 ohm. This keypad is metallic, not
    conductive rubber on carbon, so the beeper would in fact have worked. The
    warning was a reasonable precaution and cost one meter setting; it is kept
    verbatim because it was written before the measurement and rewriting it
    would hide that. It describes a hazard, not this part.

  watch_for:
    - >-
      MORE THAN SEVEN CONDUCTORS. Extra lines usually mean extra keys (flash,
      redial, memory) or a common return rather than a true matrix. Count them
      before mapping.
    - >-
      A READING THAT CHANGES WHEN THE PROBES ARE REVERSED means diodes are
      fitted, which some keypads use for rollover. The same polarity test that
      identified the capsule applies here, and it changes how the matrix is
      scanned.
    - >-
      TWO KEYS SHARING A PAIR. In a true matrix all 12 pairs are distinct. A
      duplicate means it is not a plain 4x3, or two conductors are shorted.

acceptance:
  wiring: >-
    7 conductors, 12 distinct (row, column) pairs, each ROW conductor appearing
    in exactly 3 keys and each COLUMN conductor in exactly 4. That maps straight
    onto D0-D3 rows and D4-D6 columns with no glue logic.
  closed_resistance:
    comfortable_below_ohm: 5000
    marginal_ohm: [5000, 20000]
    rationale: >-
      J11 puts 100 ohm in series with each line and there are no external
      pull-ups, so a scan relies on the Seed's internal pull-up, on the order of
      40 kohm. A few kilohm closed against 40 kohm pulls the pin well below
      logic low. Tens of kilohm does not, and would need an external pull-down
      or a stronger drive.
    record_the_worst_key: >-
      One bad key sets the requirement, so log the highest closed resistance
      across all twelve, not a typical value.

result:
  # Measured 2026-08-31 at the bench, Matt probing, keypad disconnected from the
  # mainboard, line unplugged. Full sheet:
  # discovery/evidence/2026-08-31-keypad-matrix-beepout.txt
  verdict: >-
    A PLAIN 4x3 MATRIX, seven conductors, twelve distinct pairs. The pin map in
    loa's 12-phone-build.md stands exactly as written. No glue logic, no rewire,
    no external components.

  conductors_by_colour:
    note: >-
      The harness presents seven DISCRETE COLOURED WIRES. Colour is the stable
      identifier and is used throughout; position numbers are not, because they
      invert with the connector.
    order_at_connector: [BLACK, RED, WHITE, YELLOW, ORANGE, GREEN, BLUE]
    rows: [BLACK, RED, WHITE, YELLOW]      # -> J11 D0-D3, in keypad order
    columns: [BLUE, GREEN, ORANGE]         # -> J11 D4-D6, col 1, 2, 3

  map:
    # key: [row colour, column colour, ohm closed]
    "1": [BLACK,  BLUE,   15.0]
    "2": [BLACK,  GREEN,  15.0]
    "3": [BLACK,  ORANGE, 15.0]
    "4": [RED,    BLUE,   15.0]
    "5": [RED,    GREEN,  17.5]
    "6": [RED,    ORANGE, 13.8]
    "7": [WHITE,  BLUE,   16.0]
    "8": [WHITE,  GREEN,  10.6]
    "9": [WHITE,  ORANGE, 15.0]
    "*": [YELLOW, BLUE,   13.4]
    "0": [YELLOW, GREEN,  14.0]
    "#": [YELLOW, ORANGE, 15.0]

  acceptance_met:
    conductors: 7
    distinct_pairs: 12
    each_row_in_keys: 3        # BLACK, RED, WHITE, YELLOW
    each_column_in_keys: 4     # BLUE, GREEN, ORANGE
    worst_closed_ohm: 17.5     # key 5. Threshold was 5000.
    margin: >-
      Comfortable by roughly two and a half orders of magnitude. The Seed's
      ~40 kohm internal pull-up through J11's 100 ohm series reads this without
      help. No external pull-down, no stronger drive, no buffering.

  diodes: >-
    NONE on any measured path. Ruled out by value: a series diode cannot read
    10-18 ohm in resistance mode. A polarity reversal was NOT performed, so this
    is inference from the readings rather than a direct polarity test. It is
    strong inference and it is not a direct observation; recorded as such.

  not_corrected_for_lead_resistance: >-
    Probes were never shorted to read lead and clip resistance, so the figures
    are raw. Immaterial at this margin, where the threshold is 5 kohm and the
    worst reading is 17.5 ohm. It would matter if any figure were near the
    limit; none is.

  one_transcription_slip_caught: >-
    Key 6 was first reported as RED/GREEN, the pair already recorded for key 5.
    A duplicate pair fails acceptance outright, so it was flagged rather than
    silently read as the value the completed matrix wanted. Re-probed as
    RED/ORANGE: 13.8 ohm. This is what the distinctness criterion is for.

  🔴 wiring_consequence_columns_are_reversed: >-
    Rows appear at the connector in keypad order, BLACK RED WHITE YELLOW. The
    COLUMNS DO NOT: position 5 is ORANGE which is column 3, position 7 is BLUE
    which is column 1. A straight pin-for-pin harness onto J11 therefore gives
    correct rows and BACKWARDS COLUMNS. Settle it deliberately, either by
    crossing the three column wires in the harness or by reversing the column
    index in the scan. The failure mode if neither is done is key 1 reading
    as key 3.

resolution_2026_08_31:
  answer: JST ZH, 1.5 mm pitch, 7-way
  status: confirmed
  # The ZH hypothesis was raised on 2026-08-26 from the housing width, then
  # discarded. It was right the first time.

  what_confirms_it:
    - >-
      IT MATES. A bought JST ZH 7-way stub cable seats in the keypad's PX
      header without force or slop.
    - >-
      🔴 AND IT CONDUCTED, ON ALL SEVEN. The entire matrix beep-out was made
      THROUGH that stub: twelve distinct pairs, every conductor carrying,
      10.6 to 17.5 ohm. THIS IS THE REAL PROOF, and it is stronger than the
      fit. A 1.27 mm plug on a 1.5 mm header accumulates 0.23 mm of error per
      position; by position 7 it is 1.38 mm out, nearly a whole pitch, and
      the outer contacts cannot touch. Clean readings on all seven conductors
      are only possible at the correct pitch. The measurement WAS the fit test
      and neither of us noticed at the time.
    - >-
      The 11.5 mm housing width fits ZH (10.5 mm of pitch territory plus about
      0.5 mm of wall each side) and misses Picoflex by 1.6 mm.

  why_the_1.27_derivation_failed: >-
    THE 9.0 mm FIGURE NEVER DISCRIMINATED. It was read as an overall ribbon
    width, where 7 x 1.27 = 8.89 and the fit looks like 1.2%. But 6 x 1.50 =
    9.00 EXACTLY, which is the pin-1-to-pin-7 centre span of a 1.5 mm 7-way
    part. One number, two readings, both landing on 9.0, and WHERE THE RULER
    WAS LAID WAS NEVER RECORDED. The derivation then reported a 1.2% fit as
    though it excluded 1.5 mm, when 1.5 mm was an exact fit under the other
    reading and was never computed.

  the_methodology_lesson: >-
    This record already contains the sentence "Measure the thing whose
    dimension is defined by what you want to know", filed under
    `what_settled_it`. That advice was followed and STILL produced the wrong
    answer, because a measurement is only as good as the stated convention for
    taking it. 9.0 mm is not a measurement; "9.0 mm, outer conductor edge to
    outer conductor edge" is. RECORD THE DATUM, NOT ONLY THE NUMBER.
    Worse, the housing width was the one figure that DID discriminate, and it
    was discarded as the inferior method in favour of the one that could not.

  the_original_cable_is_now_unexplained: >-
    OPEN, and it does not gate anything. A 7-conductor ribbon at 1.5 mm pitch
    should measure about 10.5 mm overall, not 9.0. Either the 9.0 mm was the
    centre span after all, or "mass terminated" was mis-observed and the grey
    cable is crimped wires in a sleeve. Re-measure only if the original cable
    is still to hand and the answer is wanted; loa does not need it, because
    loa's harness will be a ZH stub like the one that just worked.

  🔴 the_colour_map_is_EPHEMERAL: >-
    THE COLOURS BELONG TO A BOUGHT STUB CABLE, NOT TO THE KEYPAD. Black-red-
    white-yellow-orange-green-blue is one vendor's rainbow order. Replace the
    cable and every colour in `result:` becomes meaningless. What is durable is
    the HEADER PIN position, which is why it is restated here:

        header pin 1  ->  row 1   (keys 1 2 3)
        header pin 2  ->  row 2   (keys 4 5 6)
        header pin 3  ->  row 3   (keys 7 8 9)
        header pin 4  ->  row 4   (keys * 0 #)
        header pin 5  ->  column 3  (keys 3 6 9 #)
        header pin 6  ->  column 2  (keys 2 5 8 0)
        header pin 7  ->  column 1  (keys 1 4 7 *)

    Rows run in keypad order, columns run BACKWARDS. See
    `result.wiring_consequence_columns_are_reversed`.

  pin_1_anchored: >-
    CLOSED 2026-08-31. THE BLACK END OF THE STUB SITS AT THE END OF THE HEADER
    NEAREST THE `PX` SILKSCREEN. That is a feature of the board, it survives the
    cable being unplugged, and it makes every position below absolute rather
    than relative to how somebody happened to be holding the connector.

    Why it needed closing, kept because the failure is not obvious: a reversed
    connector is SILENT. Rows still read as rows and columns as columns, the
    matrix maps perfectly, every key responds, and key 1 simply comes up as
    key #. Nothing in the scan can detect it.

    Independent cross-check, ten seconds, if confirmation is ever wanted: the
    ORIGINAL ribbon's red conductor must sit at the end AWAY from PX, since red
    is on pin 7. If it turns up at the PX end instead, the two readings
    disagree and neither should be trusted.

  numbering_convention_adopted: >-
    MATT, 2026-08-31: "treating the PX side as 1 is likely how I will think
    about it." ADOPTED. Position 1 is the PX-silkscreen end, counting away from
    it. Every position in this record already uses that convention, so nothing
    is renumbered; this fixes it as the project's convention so a later reader
    does not re-derive it or silently invert it.
    NOTE THIS IS NOT THE COLUMN DECISION. Numbering and the harness column
    crossing are separate choices, and the second is still open. See
    `for_loa_the_build.the_harness_now_fully_specified`.

  🔴 THE_MAP_ANCHORED_TO_THE_BOARD: >-
    THIS IS THE DURABLE FORM. Everything else in this record, colours included,
    is derived from it or is scaffolding. Positions count FROM THE `PX`
    SILKSCREEN END of the keypad header:

      pos  toward PX     function    keys           stub colour
      ---  ---------     --------    ------------   -----------
       1   <- PX end     row 1       1  2  3        BLACK
       2                 row 2       4  5  6        RED
       3                 row 3       7  8  9        WHITE
       4                 row 4       *  0  #        YELLOW
       5                 column 3    3  6  9  #     ORANGE
       6                 column 2    2  5  8  0     GREEN
       7   far end       column 1    1  4  7  *     BLUE

    The far end, position 7, is where the ORIGINAL ribbon's RED conductor sits.

  for_loa_the_build:
    keypad_end: JST ZH 7-way, ZHR-7 housing on SZH-002T contacts, or a bought
                pre-crimped ZH stub of the kind already proven to work
    caryatid_end: J11, 2x5 IDC at 2.54 mm
    the_harness_now_fully_specified: >-
      Counting header positions from the PX end, straight through to J11:
        pos 1 -> D0   row 1        pos 5 -> D4   would give COLUMN 3
        pos 2 -> D1   row 2        pos 6 -> D5   column 2
        pos 3 -> D2   row 3        pos 7 -> D6   would give COLUMN 1
      Rows are already correct. Only the columns need attention, and REVERSING
      THREE THINGS MEANS SWAPPING THE OUTER TWO: cross positions 5 and 7, leave
      6 alone. That yields D4 = column 1, D5 = column 2, D6 = column 3 and a
      scan that needs no compensating index. Alternatively wire it straight and
      reverse the column index in firmware. One or the other, chosen once and
      written down here when it is chosen.
    note: >-
      Supersedes `consequence_for_the_build` below, which proposed clipping the
      original ribbon and beeping from stripped ends. That plan was built on the
      1.27 mm answer and on not owning a mating part. Both have changed: a ZH
      stub mates, conducts and is already in hand.


what_to_do:
  if_a_clean_4x3: >-
    Nothing. Wire the seven conductors to J11 and the pin map stands as written.
  if_not_a_matrix: >-
    Discrete or common-bus wiring needs either a rewire at the keypad or a
    different input scheme. Seven lines is what J11 offers; it does not stretch.
  if_more_than_12_keys: >-
    Decide whether the extra keys are wanted before wiring. There are no spare
    digital lines on J11 beyond the seven.


# ---------------------------------------------------------------------------
# THE CONNECTOR. Added 2026-08-26. Separate from the matrix question: this is
# how the keypad is reached, not what is behind it. The matrix is still
# unmeasured; see `the_measurement` above.
# ---------------------------------------------------------------------------
connector:
  # -------------------------------------------------------------------------
  # CONFLICT of 2026-08-31 RESOLVED THE SAME DAY, against this block.
  #
  # The seven coloured wires are a JST ZH 7-way STUB CABLE that Matt BOUGHT to
  # test with. They are not the phone's cable. So this block is not describing
  # the wrong object; it is describing the original correctly and reaching the
  # wrong conclusion from it.
  #
  # 🔴 THE CONCLUSION BELOW IS REFUTED. `candidate: Molex Picoflex` and
  # `derived_pitch_mm: 1.27` are WRONG. See `resolution_2026_08_31:` directly
  # after this block. Everything from `derived_pitch_mm` down is kept only
  # because evidence is append-only and because how it went wrong is the
  # useful part. Do not quote it.
  # -------------------------------------------------------------------------
  the_phone:
    model: Bittel HA41T-25            # 41 series, wall-mount hotel bathroom set
    board_silkscreen: "HA(41)T-25  KB  T1  2020.1.15"
    designator: PX
    keys: 12                          # confirmed by count: no redial, flash or service keys

  measured:
    header: 7 pins, vertical, board-mounted on the KB daughterboard
    cable: grey flat ribbon, one RED conductor at the edge (pin 1 marker)
    ribbon_width_mm: 9.0
    conductors: 7
    awg: 28
    termination: >-
      MASS TERMINATED. The ribbon enters the housing intact; the conductors are
      not fanned out and individually crimped. This is what rules out every
      crimp-only family.
    cable_housing_width_mm: 11.5
    retention: >-
      NO LATCH. Small plastic rails on the cable-side housing engage side slots
      on the board-side part. Friction and keying, not a positive lock.

  derived_pitch_mm: 1.27
  derivation: >-
    A mass-terminated ribbon's pitch must equal the connector's, so the ribbon
    width gives it directly. 7 conductors at 1.27 mm predicts 8.89 mm against
    9.0 measured, 1.2% out. 1.25 is 2.8% out, 1.00 is 22%, 1.50 is 17%.
    1.27 mm is 0.05 inch, the worldwide ribbon standard, and 28 AWG is its
    standard conductor.

  candidate: Molex Picoflex
  candidate_status: FIT, NOT CONFIRMED
  why_it_fits: >-
    Picoflex is a 1.27 mm IDT system for standard ribbon, specifying 26-28 AWG,
    circuits 4 to 26, low-profile vertical header to a ribbon-terminated
    receptacle, available with or WITHOUT latches. Every observation matches,
    including the absent latch.
  how_to_confirm: >-
    Look for a Molex logo or moulded part number on the receptacle, or buy ONE
    7-circuit part and test-fit before ordering a quantity. Other vendors make
    1.27 mm ribbon IDT connectors and nothing on this housing has been read as
    a marking.
  part_families_if_confirmed:
    receptacle: Molex Picoflex 90325 series
    header: Molex Picoflex 90814 series
    assemblies: Molex Picoflex 90327 series, dual-ended ribbon
    stocked_by: DigiKey, Mouser, TTI, TME

  refuted_along_the_way:
    - >-
      "1.25 mm FFC" -- derived from the 11.5 mm housing using an FFC's ~2 mm
      wall allowance. There are no exposed fingers; it was never an FFC. The
      wall allowance came from the assumed family and took the answer with it.
    - >-
      "1.5 mm, JST ZH" -- same housing width re-derived with wire-to-board wall
      thickness. Refuted because the part is ribbon-terminated and ZH is
      crimp-only, with no ribbon variant.
    - >-
      "the JST GH comparison rules out anything below 1.5 mm" -- GH is 1.25 and
      standard ribbon is 1.27. A 0.12 mm difference across the whole span
      cannot be seen, so that comparison never carried the weight put on it.
    - >-
      AMP CT was not considered at all until Matt asked. The first pitch table
      contained only JST and Molex families and silently excluded TE, whose CT
      line spans 1.2 / 1.5 / 2.0 mm. The candidate set was too small and the
      answer looked better determined than it was.

  what_settled_it: >-
    The width of the ribbon, with a ruler. Every earlier attempt inferred pitch
    from a housing dimension through an assumed wall thickness, an assumption
    stacked on an assumption. Measure the thing whose dimension is defined by
    what you want to know. See conventions rule 10.

  consequence_for_the_build: >-
    1.27 mm ribbon is exactly half of J11's 0.1 inch IDC pitch, and 0.05 inch
    ribbon is what 2.54 mm IDC connectors are built to bite, so the caryatid end
    is a solved problem. The safest path needs nothing ordered: clip the ribbon
    at the mainboard end, keep the red conductor as pin 1, and beep out from the
    stripped ends. That harness is scrap once caryatid replaces the mainboard,
    and the keypad and its header are never touched.

evidence:
  # The MATRIX is still unmeasured. These record the connector and the key
  # count, which are what the beep-out will be done through.
  - "2026-08-26: connector characterised. 7-way, 1.27 mm pitch derived from a
     9.0 mm 7-conductor mass-terminated ribbon (1.2% fit), 28 AWG, no latch,
     rails and slots for keying, cable housing 11.5 mm. Molex Picoflex is a fit
     but NOT confirmed. Phone is a Bittel HA41T-25, keypad board HA(41)T-25 KB
     T1 dated 2020.1.15, connector silkscreened PX
     (2026-08-26-keypad-connector-identification.txt)"
  - "2026-08-26: TWELVE keys counted, nothing else. No redial, flash or guest
     service keys, so 7 conductors is consistent with a plain 4x3 matrix. This
     CORROBORATES the pin map's assumption; it does not verify it, since 7
     conductors could still be wired otherwise"

  - "2026-08-31: MATRIX MEASURED AND CONFIRMED. Plain 4x3, 7 conductors, 12
     distinct pairs. Rows BLACK/RED/WHITE/YELLOW at 3 keys each, columns
     BLUE/GREEN/ORANGE at 4 keys each. Closed resistance 10.6 to 17.5 ohm,
     worst key 5 at 17.5 ohm against a 5000 ohm threshold. Meter in resistance
     mode, keypad disconnected from the mainboard, line unplugged
     (2026-08-31-keypad-matrix-beepout.txt)"
  - "2026-08-31: THE CARBON-PAD PREMISE DID NOT HOLD. Every key is a metallic
     closure in the 10-18 ohm range, almost certainly metal dome or tact,
     consistent with a 2020-dated set. The continuity beeper this record warns
     against would have worked. The warning is kept as written; it describes a
     hazard, not this part (2026-08-31-keypad-matrix-beepout.txt)"
  - "2026-08-31: THE ORIGINAL RIBBON'S RED CONDUCTOR IS ON PIN 7, NOT PIN 1, as
     the phone shipped. Refutes the 2026-08-26 note reading it as a pin 1
     marker, which was convention assumed rather than observed. Red therefore
     marks the column 1 end. Partial anchor only: it fixes the two cables
     relative to each other, not either to the board
     (2026-08-31-keypad-matrix-beepout.txt)"
  - "2026-08-31: CONNECTOR CONFIRMED as JST ZH, 1.5 mm, 7-way. A bought ZH stub
     cable mates with the PX header AND carried the entire 12-key beep-out on
     all seven conductors, which is only possible at the correct pitch. This
     REFUTES the 2026-08-26 derivation of 1.27 mm and Molex Picoflex. That
     derivation rested on a 9.0 mm reading that fits 1.27 mm as an overall
     ribbon width (8.89) and 1.5 mm as a pin-centre span (9.00) equally well,
     with the datum never recorded; the 11.5 mm housing width, which does
     discriminate and points at ZH, had been set aside
     (2026-08-31-keypad-matrix-beepout.txt)"
  - "2026-08-31: CONFLICT on the connector, RAISED AND RESOLVED same day. The cable on the bench is seven
     discrete coloured wires, crimped, BLACK at the edge, not the grey mass-
     terminated ribbon with a red edge conductor recorded 2026-08-26. Mass
     termination was the sole observation refuting JST, so the Picoflex
     derivation is no longer supported. Provenance of the coloured harness
     resolved: the coloured wires are a bought JST ZH test stub, not the phone's
     cable. Consequence: the colour-to-function map is ephemeral and the
     durable map is by header pin. Pin 1 is NOT yet anchored to a physical
     feature (2026-08-31-keypad-matrix-beepout.txt)"

last_verified: 2026-08-31

notes: >-
  THIS RECORD EXISTS FOR THE SAME REASON carbon-capsule-DC-resistance DOES. The
  keypad question has been carried in 12-phone-build.md as "beep it out before
  assuming seven discrete lines" without ever saying what result would mean
  what. A carried question with no threshold attached cannot be closed by
  anyone, including the person who wrote it.

  IT DOES NOT GATE THE BOARDS. caryatid is fabricated and J11 is a general
  digital bus; nothing about this measurement changes what was ordered. It gates
  loa's wiring and its firmware input reader.
