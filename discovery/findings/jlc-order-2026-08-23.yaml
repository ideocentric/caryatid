evidence:
  - >-
    2026-08-23: settings transcribed by Matt from the JLCPCB quote form before
    placing the order, and recorded here rather than in conversation.
  - >-
    2026-08-23: 🔴 MIN VIA HOLE SIZE CONFLICTS WITH THE BOARD. The form is set to
    "0.4mm/(0.4/0.45mm)" but the board carries 157 vias at 0.3 mm drill (0.7 mm
    pad) and only 10 at 0.4 mm (0.8 mm pad). 94% of the vias are below the size
    the order declares. Read off the board directly, not inferred.
  - >-
    2026-08-23: silkscreen verified against the ink-jet floor. Smallest VISIBLE
    silk text is exactly 0.80 mm and NOTHING is below it: 31 items at 0.80,
    8 at 0.85, 2 at 0.90, 175 at 1.00, plus the two large brand items. So the
    board is inside the process, with zero margin on 31 of them. On black mask
    with white ink that is the combination most likely to read soft, but it is
    not a violation and no change is proposed.
  - >-
    2026-08-23: FID1, FID2 and FID3 exist on the board, so assembly has proper
    optical alignment targets independent of whatever JLC does about tooling
    holes.
  - >-
    2026-08-23: "Via Covering: Tented" is now unambiguously the right choice and
    was not always. fix_ep_thermal.py records that U1's exposed pad once carried
    four thermal vias sitting inside the EP's mask aperture, open on top and
    sealed underneath, with paste printed across them; tenting them was rejected
    because four 0.90 mm mask discs would have covered 2.545 mm2 of a 2.822 mm2
    pad. Those vias were removed. With no via inside any paste aperture, a
    blanket tent has nothing left to conflict with.
  - >-
    2026-08-23: CORRECTION from Matt, superseding the entry above. The minimum
    via hole size is "0.3mm/(0.4/0.35mm)", not the "0.4mm/(0.4/0.45mm)" I
    transcribed. THE BLOCKING CONFLICT WAS MINE AND DOES NOT EXIST. The board's
    0.3 mm drills are inside the declared minimum and their 0.7 mm pads clear
    the declared via diameter comfortably. All eight checkable settings now
    agree with the board. The entry above is left standing rather than edited,
    because evidence is append-only and a wrong reading is worth being able to
    see.

  - >-
    2026-08-23: SURFACE FINISH CHANGED FROM LEADFREE HASL TO ENIG, about $20 on
    the order, decided by Matt. This closes hasl-under-fine-pitch. THE PASTE WAS
    DELIBERATELY LEFT ON "High temp.", and that is correct rather than an
    oversight: ENIG contains no solder, being electroless nickel under a thin
    immersion gold that dissolves into the joint within seconds, so the joint
    forms against the nickel and the alloy is whatever the paste brings. Nothing
    is contributed that was not already in the paste, so a lead-free finish and
    lead-free paste stay a matched pair and the board stays RoHS.
  - >-
    2026-08-23: A LEADED HASL REVERT WAS CONSIDERED AND REJECTED, and the reason
    is worth keeping because the option looked harmless. Matt proposed reverting
    to "HASL Leaded", JLC's default. It would not have addressed the QFN concern
    at all, since that was about HASL versus ENIG rather than lead-free versus
    leaded, and leaded HASL is still HASL. Worse, it would have paired a
    lead-bearing finish with the lead-free SAC paste already selected, giving a
    MIXED ALLOY JOINT: lead from the finish dissolves in and produces a
    Sn-Pb-Ag-Cu mixture with a lower melting point and less predictable
    reliability. That is the classic backward-compatibility trap of the
    lead-free transition and is worse than either system used consistently. Had
    the revert gone ahead, the paste would have had to change with it.
  - >-
    2026-08-23: ENIG's known failure mode recorded so the term is not new if it
    ever appears. "Black pad" is a corroded nickel surface caused by poor
    phosphorus control in the plating bath; joints look sound and are brittle.
    It is a fab process-control problem rather than a design choice, and JLC
    runs ENIG at very high volume. Not a reason to avoid it, and no action.
open_questions:
  - id: min-via-hole-mismatch
    severity: resolved
    summary: >-
      RESOLVED 2026-08-23, and it was a transcription error rather than a
      setting error. The form is "0.3mm/(0.4/0.35mm)", not the 0.4 mm first
      recorded here. The board's 157 vias at 0.3 mm drill are inside it, and
      their 0.7 mm pads give a 0.2 mm annular ring against a declared minimum
      via diameter of 0.35-0.40 mm. Nothing to change and nothing to re-quote.
  - id: hasl-under-fine-pitch
    severity: resolved
    summary: >-
      CLOSED 2026-08-23 by changing the finish to ENIG for about $20. The
      concern was U1, a QFN-16 on 0.5 mm pitch with an exposed pad: a no-lead
      package has no legs to flex, so it sits on the solder rigidly and cannot
      take up an uneven surface, and its exposed pad needs even contact across
      a face nobody can inspect afterwards. HASL leaves slightly domed pads
      because surface tension mounds the solder; ENIG plates a thin even layer
      and is essentially as flat as the copper beneath. NO PASTE CHANGE WAS
      NEEDED, which is the part worth recording, and it is NOT true of every
      finish. See the leaded-hasl-mixed-alloy note below.
  - id: no-placement-confirmation
    severity: worth-knowing
    summary: >-
      Confirm Parts Placement and Confirm Production File are both off, on a
      FIRST ARTICLE carrying 127 placements. Those steps exist to catch
      orientation and footprint errors before anything is soldered. Turning them
      on costs time rather than money. Photo Confirmation is off too, so nothing
      is seen before the boards ship.
  - id: jumper-placement-preview-wrong
    severity: for-next-time
    raised: 2026-08-23
    summary: >-
      NOTED FOR A FUTURE BUILD, DELIBERATELY NOT CHASED NOW. Matt reports that in
      JLC's Component Placing preview the JUMPERS come through almost always with
      the wrong orientation AND shifted off their own footprints. Seen across
      builds, so it is a pattern rather than a one-off on this board.
      Not investigated here because it does not block the order: the CPL is
      generated from the board by fab_package.py and the board itself is
      verified, so the question is where the discrepancy is introduced.
      WHERE TO LOOK NEXT TIME, cheapest first:
      (1) compare cpl.csv's rotation column for JP1-JP6 against the board's own
          footprint rotations, which settles whether the export or the import is
          at fault;
      (2) check whether the KiCad footprint origin for PinHeader_1x03 sits on
          pin 1 rather than the body centre, since JLC positions from the origin
          and a pin-1 origin reads as a shift;
      (3) check JLC's own rotation convention for headers against KiCad's, which
          are known to differ for several package families and are the usual
          cause of exactly this symptom.
      IF IT MATTERS THIS BUILD: the jumpers are 3-pin headers whose three pins
      are electrically interchangeable by position, so a 180 degree rotation
      changes which pin is pin 1 and therefore which pair a shunt bridges. That
      is a real functional error, not cosmetic, and it is worth eyeballing the
      preview before approving even though the root cause is being deferred.
  - id: tooling-holes-by-jlc
    severity: worth-knowing
    summary: >-
      Tooling holes are set to "Added by JLCPCB" while Delivery Format is Single
      PCB and depanelling is off. Worth knowing where they intend to put them:
      the board is fully routed and poured, so holes added inside the outline
      would land in copper. Fiducials already exist, so the alignment need is
      covered.

  - >-
    2026-08-23: ORDER PLACED. Merchandise $176.24, shipping $46.97, customs
    duties and taxes $63.21, payment fee $1.43, sales tax $19.10, GRAND TOTAL
    $306.95. A mid-checkout figure of $197.51 (with a $9.00 coupon and $30.27
    shipping) was superseded before payment; the coupon is absent from the final
    breakdown.
  - >-
    2026-08-23: THE ESTIMATE WAS GOOD AND THE BUDGET WAS NOT, and the two are
    different claims. cost_estimate.py predicted $161.68 of merchandise against
    $176.24 actual, out by $14.56 or 9%, which for a tool with an admitted
    placeholder on the fab line is a decent result. But it models MERCHANDISE
    ONLY. Shipping, duties, payment fee and sales tax added $130.71, a 74%
    UPLIFT on the goods, with customs duties alone at 36% of merchandise. An
    estimate can land within 9% of the goods and still be half the money that
    actually leaves the account.
  - >-
    2026-08-23: PCB_FAB[5] moved from a $28.00 guess to $42.56 MEASURED,
    attributing the whole $14.56 gap to the only line the tool flagged as
    guessed. That is consistent rather than convenient: the $28.00 predated the
    ENIG change, ENIG cost about $20, so a naive expectation was $48 and the
    real base fab came in cheaper than guessed. Every other quantity in PCB_FAB
    is still a placeholder and is now labelled as such.

  - >-
    2026-08-24: BOARD SNAPSHOT ARCHIVED as
    discovery/evidence/2026-08-22-board-snapshot-28c54f1.pdf, a nine-page
    reference plot of exactly the copper this order was placed against. Produced
    by `fab_package.py --apply --archive`, which was added for this purpose.
    DATED AND STAMPED BY THE BOARD'S LAST CHANGE (28c54f1, 2026-08-22) RATHER
    THAN BY THE RUN, so the filename identifies the copper rather than the
    moment someone happened to export it, and re-running produces the same name
    until the board actually moves. It answers "what exactly did we buy" without
    a KiCad install and without checking out an old commit to find out.
  - >-
    2026-08-24: the snapshot format changed on Matt's instruction from nine
    monochrome separations to ONE COMPOSITE PAGE, stacked as the PCB viewer
    presents it: back copper underneath, front copper over it, silkscreen on top
    where it stays readable. A stack of separations is what a fab reads; a
    person reading a board wants the picture. A SCHEMATIC SNAPSHOT was added
    alongside it, 2026-08-21-schematic-snapshot-eb5a8e1.pdf, six pages covering
    the whole hierarchy.
    A BUG WAS CAUGHT DOING THIS. The schematic stamp first read only
    caryatid.kicad_sch, the root sheet, and dated the archive 2026-08-09 when
    the schematic was last edited on 2026-08-21. The root is a container and the
    circuits live in power, seed, panel-io and audio; ADR 0010's changes never
    touched it. A snapshot claiming to predate its own contents is worse than no
    snapshot. It now stamps from the whole hierarchy.

  - >-
    2026-08-24: THE ARCHIVED SCHEMATIC SNAPSHOT NOW DIFFERS FROM THE CURRENT
    SCHEMATIC, deliberately and correctly.
    2026-08-21-schematic-snapshot-eb5a8e1.pdf is the schematic as it stood when
    this order was placed. Afterwards, JP6 was lifted 22.86 mm out of the title
    block on audio.kicad_sch, a purely cosmetic move verified netlist-identical
    across all 113 nets, ERC 0 and schematic parity 0. THE BOARD WAS NOT
    TOUCHED, so nothing about what was manufactured changed. Re-running
    --archive from here produces a second, differently stamped file rather than
    overwriting this one, which is the intended behaviour: one snapshot per
    state, and this one remains the answer to "what did we buy".
    docs/reference/caryatid-schematic.pdf carries the current version, because
    that copy is named for being current rather than for provenance.

