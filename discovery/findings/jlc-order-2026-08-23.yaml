evidence:
  - >-
    2026-08-23: settings transcribed by Matt from the JLCPCB quote form before
    placing the order, and recorded here rather than in conversation.
  - >-
    2026-08-23: 🔴 MIN VIA HOLE SIZE CONFLICTS WITH THE BOARD. The form is set to
    "0.4mm/(0.4/0.45mm)" but the board carries 157 vias at 0.3 mm drill (0.7 mm
    pad) and only 10 at 0.4 mm (0.8 mm pad). 94% of the vias are below the size
    the order declares. Read off the board directly, not inferred.
  - >-
    2026-08-23: silkscreen verified against the ink-jet floor. Smallest VISIBLE
    silk text is exactly 0.80 mm and NOTHING is below it: 31 items at 0.80,
    8 at 0.85, 2 at 0.90, 175 at 1.00, plus the two large brand items. So the
    board is inside the process, with zero margin on 31 of them. On black mask
    with white ink that is the combination most likely to read soft, but it is
    not a violation and no change is proposed.
  - >-
    2026-08-23: FID1, FID2 and FID3 exist on the board, so assembly has proper
    optical alignment targets independent of whatever JLC does about tooling
    holes.
  - >-
    2026-08-23: "Via Covering: Tented" is now unambiguously the right choice and
    was not always. fix_ep_thermal.py records that U1's exposed pad once carried
    four thermal vias sitting inside the EP's mask aperture, open on top and
    sealed underneath, with paste printed across them; tenting them was rejected
    because four 0.90 mm mask discs would have covered 2.545 mm2 of a 2.822 mm2
    pad. Those vias were removed. With no via inside any paste aperture, a
    blanket tent has nothing left to conflict with.

open_questions:
  - id: min-via-hole-mismatch
    severity: blocking
    summary: >-
      The order declares a 0.4 mm minimum via hole; the board has 157 vias at
      0.3 mm. Either the form needs the smaller option selected, which usually
      changes the price, or JLC raises it in engineering review, or worst case
      the drills get enlarged to suit the declared spec. 0.3 mm drill on a
      0.7 mm pad is a 0.2 mm annular ring; enlarging to 0.4 mm leaves 0.15 mm,
      which is at the edge of what a 2-layer process holds reliably.
      SETTLE THIS BEFORE SUBMITTING.
  - id: hasl-under-fine-pitch
    severity: worth-knowing
    summary: >-
      LeadFree HASL against U1, a QFN-16 on 0.5 mm pitch with an exposed pad.
      HASL leaves a less flat finish than ENIG, and flatness is what fine-pitch
      and EP joints care about. Very common and usually fine; ENIG is the usual
      upgrade when a board is QFN-heavy. Raised as a considered trade rather
      than an error, because it is one part and the rest of the board is
      forgiving.
  - id: no-placement-confirmation
    severity: worth-knowing
    summary: >-
      Confirm Parts Placement and Confirm Production File are both off, on a
      FIRST ARTICLE carrying 127 placements. Those steps exist to catch
      orientation and footprint errors before anything is soldered. Turning them
      on costs time rather than money. Photo Confirmation is off too, so nothing
      is seen before the boards ship.
  - id: tooling-holes-by-jlc
    severity: worth-knowing
    summary: >-
      Tooling holes are set to "Added by JLCPCB" while Delivery Format is Single
      PCB and depanelling is off. Worth knowing where they intend to put them:
      the board is fully routed and poured, so holes added inside the outline
      would land in copper. Fiducials already exist, so the alignment need is
      covered.

last_verified: 2026-08-23

notes: >-
  STATUS IS `in-progress` BECAUSE THE ORDER IS NOT PLACED. It moves to
  `confirmed` when the order is submitted and JLC accepts the files without an
  engineering query, and the quoted total is recorded against it. If JLC comes
  back on the via hole size, that is the mismatch above and not a surprise.

  EVERYTHING NOT LISTED AS AN OPEN QUESTION AGREES WITH THE BOARD. Dimensions,
  layer count, thickness, assembly side, quantity and assembly type were each
  checked against the file or against an existing record rather than accepted
  as typed.

  THE FAB PRICE IS STILL THE UNKNOWN. 150 x 90 mm is area-priced past JLC's
  100 x 100 tier and cost_estimate.py's PCB_FAB is a placeholder, so the quoted
  total is the figure that closes that open question. Run
  `.venv/bin/python tools/cost_estimate.py 5 --quote <total>` once it is known.