id: BT1-cell-fit
kind: other
source_claim: >-
  That BT1 (MPD BH-18650-PC) and a protected 18650 are compatible. Never stated
  outright anywhere; it was assumed by every document that discusses the battery,
  and the board silkscreens "PROTECTED CELL ONLY" beside BT1, which asserts the
  requirement without ever checking that a protected cell physically fits.
source_ref: >-
  hardware/pcb/lcsc.yaml self_fit.BT1; docs/sourcing.md; the "PROTECTED CELL
  ONLY" gr_text at hardware/pcb/caryatid.kicad_pcb:38541
resource: >-
  MPD BH-18650-PC holder (Digi-Key 3029216) against Orbtronic 3400 mAh protected
  button-top 18650 (Panasonic NCR18650B core), five of each
status: conflict

measured:
  holder:
    part: MPD BH-18650-PC
    accepts_cell_length_mm: [65, 68]
    wording: "65-68MM in length only"
    named_compatible_examples: [Panasonic NCR 18650B, Samsung 26J]
    top_type: button top only, protected (PCB)
    contacts: 302 stainless spring temper, nickel plated
    cavity_length_mm: null      # NOT PUBLISHED, see notes
    contact_travel_mm: null     # NOT PUBLISHED
  cell:
    part: Orbtronic 3400 mAh protected button top
    core: Panasonic NCR18650B
    length_mm: 68.9
    length_tolerance_mm: 0.03
    diameter_mm: 18.6
    diameter_tolerance_mm: 0.03
    capacity_mah: 3400
    length_measured_mm: 69.48   # Matt, in hand, INCLUDING the shrinkwrap
  board_commitment:
    # Measured from hardware/pcb/caryatid.kicad_pcb 2026-08-23. This is what a
    # holder substitution would have to match, or the board changes.
    pin_spacing_mm: 72.900      # pads at x 80.900 and 153.800
    m3_hole_spacing_mm: 55.610  # NPTH d3.2 at x 89.345 and 144.955
    courtyard_mm: [79.20, 22.40]
  holder_cavity:
    # SUPERSEDED by the STEP model below. The 72.9 mm figure is neither a cavity
    # nor a coincidence: it is the PIN SPACING, and it also happens to be twice
    # the 36.640 mm contact root position.
    internal_length_mm: 72.9
    figure_is_ambiguous: true
  step_model:
    # local/reference/BH-18650-PC.STEP, SolidWorks 2016, AP214, dated 2019-11-12.
    # Three named solids: Housing, Positive Contact, Negative Contact.
    source: local/reference/BH-18650-PC.STEP
    evidence_file: discovery/evidence/2026-08-23-bt1-step-geometry.txt
    housing_overall_mm: [77.700, 25.235, 20.900]
    contact_face_at_rest_mm: 30.752      # each side, so 61.504 mm apart
    contact_root_mm: 36.640              # where it anchors
    contact_length_mm: 5.888             # 36.640 - 30.752, the deflection budget
    housing_inner_wall_mm: 35.450        # innermost housing material in the
                                         # cell's swept envelope, so the cell
                                         # cannot exceed 70.900 mm at all
    free_separation_mm: 61.504
    hard_stop_cell_length_mm: 70.900
    spring_wire_width_mm: 0.38
    # Derived from MPD's OWN two numbers, not from anything measured:
    # a 72.9 mm cavity accepting 65-68 mm cells means the spring occupies
    # between 4.9 mm (at the longest cell) and 7.9 mm (at the shortest).
    spring_window_mm: [4.9, 7.9]
    gap_with_this_cell_mm: 3.42 # 72.9 - 69.48
  delta_mm: 1.48                # 69.48 measured, against a 68 mm stated maximum

evidence:
  - >-
    2026-08-23: Matt stated the cells are already ordered, direct from Orbtronic:
    "18650 3400mAh Protected Battery Rechargeable Lithium-ion 3.7V Orbtronic
    Button Top (Core Cell: Panasonic-Sanyo)".
  - >-
    2026-08-23: cell dimensions read from orbtronic.com's own product page for
    that part. It states "Length (mm): 68.9 mm (+/- 0.03)" and "Diameter (mm):
    18.6 mm (+/- 0.03)", capacity 3.4 Ah, core cell Panasonic NCR18650B.
  - >-
    2026-08-23: holder limits read from batteryholders.com (MPD's own site) for
    BH-18650-PC. It states the holder is for a "protected button top 18650
    battery (PCB)" and takes cells "65-68MM in length only", naming Panasonic
    NCR 18650B and Samsung 26J as examples. CONFLICTS with the cell above by
    0.9 mm.
  - >-
    2026-08-23: products.memoryprotectiondevices.com checked for a cavity
    dimension, contact travel or spring compression figure that might show
    whether 68.9 mm seats anyway. NONE PUBLISHED. The page gives materials,
    temperature range and compliance only, and offers no datasheet PDF. So the
    65-68 mm range is the only figure there is, and there is no published basis
    for arguing past it.
  - >-
    2026-08-23: searched MPD's range for a same-footprint holder accepting a
    longer cell. Nothing found that drops in. BK-18650-PC2, BH-18650-W and
    BK-18650-PC8 differ in mounting, termination or cell count. Substituting the
    holder was ALREADY rejected once on 2026-08-19 because BT1's footprint is
    dimensionally specific and swapping it is a board change; that reasoning is
    unchanged and now matters more.

  - >-
    2026-08-23: Matt MEASURED a cell in hand at 69.48 mm INCLUDING its plastic
    shrinkwrap. This supersedes the 68.9 mm catalogue figure and is worse: the
    published number evidently excludes the wrap. Against the holder's stated
    68 mm maximum the overshoot is 1.48 mm, not 0.9.
  - >-
    2026-08-23: the overshoot resolved against the holder's cavity rather than
    its stated cell range, using MPD's own numbers. The BT1 sheet gives 72.9 mm
    internal and the springs are 0.38 mm wire. A 72.9 mm cavity that accepts
    65-68 mm cells means the spring stack occupies between 4.9 mm (longest cell)
    and 7.9 mm (shortest). A 69.48 mm cell leaves 3.42 mm, which is 1.48 mm
    INSIDE the bottom of that window. The spring would have to compress past the
    travel MPD's own range implies, and at 0.38 mm wire a 3.42 mm gap is close
    to coil bind for any realistic coil count. THIS IS NO LONGER A MARGINAL
    OVERSHOOT ON A CONSERVATIVE SPEC. It is outside the geometry the holder
    describes, and the failure mode is a cell that will not seat or a holder
    held under permanent stress.
  - >-
    2026-08-23: PROVENANCE. Matt reports the cells were bought from a link
    supplied in an earlier conversation about this specific BT1, so the pairing
    was recommended rather than independently chosen. The recommendation was
    wrong, and neither part is at fault on its own: BH-18650-PC is a sound
    holder for a 65-68 mm cell and the Orbtronic 3400 is a sound cell. It is the
    PAIRING that was never checked against both specifications.

  - >-
    2026-08-23: BT1's footprint measured off the board. Its two electrical pads
    are 72.900 mm apart and its two M3 holes 55.610 mm apart, courtyard
    79.20 x 22.40 mm. THIS CASTS DOUBT ON THE 72.9 mm "internal" FIGURE. 72.900
    is the PIN SPACING on this board, and pins sit at the outer ends with the
    contacts inboard of them, so a holder's cell cavity is necessarily SHORTER
    than its pin spacing. If the sheet figure is the same 72.9, it is most
    likely that same pin dimension rather than a cavity, in which case the gap
    left for the spring is smaller than 3.42 mm and the fit is worse than the
    arithmetic above suggests, not better. The 3.42 mm figure should be treated
    as a CEILING on the spring space, not an estimate of it.
  - >-
    2026-08-23: MPD's own family page states that PCM-equipped cells are "1mm
    longer than standard", which puts a protected cell around 66.3 mm. The
    market says otherwise: a protection PCB adds 2-3 mm and protected button-top
    18650s run 68-71 mm, with 68 the practical floor. THAT IS THE ROOT CAUSE.
    BH-18650-PC's 65-68 mm window was specified against an underestimate of how
    long protected cells actually are, which is why it sits at the very bottom
    of the real distribution and admits almost none of the market.
  - >-
    2026-08-23: searched for a replacement holder that publishes a cell-length
    range covering ~70 mm. NONE FOUND. Keystone 1043 (Digi-Key 36-1043-ND,
    77 x 20.65 x 14.86 mm overall, 71.64 mm pin spacing, $2.99/1, 19,165 in
    stock) publishes overall dimensions and pin spacing but no cavity length or
    cell range; Digi-Key's Keystone highlight page distinguishes 1042/1043 only
    as SMD versus through-hole, not standard versus protected. MPD is unusual in
    publishing a range at all. CONSEQUENCE: no substitute can currently be
    recommended ON SPECIFICATION, because the specification is not published.
    Swapping to an unverified holder trades one unchecked pairing for another.
    Note also that 71.64 mm does not match this board's 72.900 mm pin spacing,
    so a Keystone 1043 is a board change regardless.

  - >-
    2026-08-23: RESOLVED GEOMETRICALLY from the manufacturer's own STEP model,
    which Matt placed at local/reference/BH-18650-PC.STEP. It carries three
    named solids -- Housing, Positive Contact, Negative Contact -- so the
    contacts can be measured separately from the body. Contacts are modelled AT
    REST: each contact face sits at 30.752 mm from centre, 61.504 mm apart,
    anchored at 36.640 mm, giving each 5.888 mm of length to deflect through.
    The innermost housing material in the cell's swept envelope is at 35.450 mm,
    so the housing itself cannot accept a cell longer than 70.900 mm.
    THE CELL FITS. At 69.48 mm it stops 0.710 mm short of the housing walls on
    each side, so there is no interference. What it does is DEFLECT EACH CONTACT
    3.988 mm, against 3.248 mm at MPD's stated 68 mm maximum and 1.748 mm at
    their 65 mm minimum. That is 23% more deflection than the rating allows, and
    it leaves 1.900 mm of contact length where the rating leaves 2.640 mm.
    SO THE 65-68 mm RATING IS ABOUT CONTACT STRESS, NOT ABOUT INTERFERENCE, and
    the two claims were never really in conflict: the cell goes in, and the
    question is whether the contacts take a permanent set. At 0.38 mm material
    and 1.900 mm remaining they are not near a flat stack, which would be
    roughly 0.8-1.1 mm, so this is over-deflection rather than coil bind.
    RESIDUAL RISK, and it is the one worth weighing: a contact pushed past its
    elastic limit stops springing back, and would then make poor pressure on any
    shorter cell fitted later. For an instrument whose cell is fitted once and
    rarely removed that is a mild consequence. It is not zero.

last_verified: 2026-08-23

notes: >-
  RESOLVED 2026-08-23 BY THE STEP MODEL, AND THE ANSWER IS "IT FITS, UNDER
  PROTEST". The cell clears the housing by 0.710 mm a side and over-deflects
  each contact by 0.740 mm beyond rating. Status stays `conflict` rather than
  `confirmed` because nothing has been ASSEMBLED yet: the geometry says it
  seats, and only a holder in hand says it seats with sane force. That test now
  costs $3.47 and settles it completely.

  SUPERSEDED 2026-08-23 BY A MEASUREMENT. An earlier revision of this note
  called the conflict 0.9 mm and "not obviously fatal", reasoning that spring
  contacts usually have travel beyond their stated range. Matt then measured a
  cell at 69.48 mm with its shrinkwrap, and resolving that against the 72.9 mm
  cavity leaves 3.42 mm for a spring stack MPD's own numbers say needs 4.9 mm at
  minimum. The optimistic reading is gone. Treat the pairing as incompatible
  until something measured says otherwise.

  IT IS RECORDED AS `conflict` RATHER THAN RESOLVED, DELIBERATELY. Two sources
  disagree, both are the manufacturers' own, and picking the convenient one is
  exactly what the ledger exists to prevent. MPD names the Panasonic NCR18650B
  as compatible and the Orbtronic cell IS an NCR18650B, which is suggestive and
  proves nothing: a bare NCR18650B is about 65.3 mm, and the protection PCB and
  button top are what carry it to 68.9. MPD may be describing a shorter
  protected build from another vendor.

  WHY THIS IS CHEAP TO SETTLE RIGHT NOW, AND EXPENSIVE LATER. The cells are in
  hand and the holders are NOT ordered yet; they are a line on a Digi-Key order
  that has not been placed. So the question can be closed by measuring a cell
  and, if there is doubt, buying one holder before committing to five. After the
  boards are assembled the options are worse: a different holder is a board
  change, because BT1's footprint is dimensionally specific and its two M3 bolt
  holes are at 55.61 mm.

  THE FALLBACK IS A DIFFERENT CELL, NOT A DIFFERENT HOLDER. Protected 18650s
  vary in length by vendor and several sit inside 65-68 mm. Changing the cell
  costs an order; changing the holder costs a board revision.

  SEPARATELY, AND NOT A CONFLICT: the cell is 3400 mAh where docs/values.md
  assumes 3000 mAh throughout. That is the safe direction for runtime, which
  becomes conservative rather than wrong. It is NOT the safe direction for
  charge time, which gets roughly 13% longer at the same 1 A. Charge rate
  improves slightly, 1 A on 3400 mAh being 0.29C against the 0.33C the document
  reasons about. Those figures should be regenerated from 3400 mAh rather than
  left reading as though they described the cell that was actually bought.