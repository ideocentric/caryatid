id: loa-handset-capsule
kind: other
source_claim: >-
  Which capsule type sits in loa's handset was carried as an open question from
  2026-08-19: "carbon, electret or dynamic. A DC resistance measurement sets the
  answer." It gated the jumper settings, the gain leg and the R52/R54 power
  question, and was never measured because the phone was not to hand.
source_ref: >-
  loa docs/design/12-phone-build.md items 191 and 203; caryatid
  docs/capture-checklist.md "Measure the handset capsule";
  docs/mic-configurations.md "First, identify the capsule"
resource: >-
  The transmitter (mouthpiece) capsule in loa's handset, and the receiver
  (earpiece) element alongside it
status: confirmed

measured:
  date: 2026-08-25
  transmitter:
    forward_kohm: [1.75, 1.77]
    reverse_kohm: [1.05, 1.06]
    steady: true          # no jump when tapped, which rules out carbon
    conditions: >-
      At the capsule terminals, out of circuit, after removing hot-melt glue
      that had been covering them. Earlier readings taken by poking through
      that glue are not recorded as capsule values: a bad contact reads HIGH,
      which biases toward the safe-looking end of every threshold.
  receiver:
    ohm: 145.3
    note: >-
      Consistent with a magnetic/dynamic earpiece. Not needed for the mic
      question; recorded because it identifies the other pair, and because it
      is the figure to use if the receiver is ever driven as an output.
  jack_pairs:
    outer_kohm: 1.054     # matches the transmitter reverse reading -> the mic
    inner_kohm: 0.824
    # ⚠️ WHICH CONDUCTORS these were was NOT recorded here until 2026-09-22.
    # See `measured_2026_09_22` for the colours and both directions.

measured_2026_09_22:
  # At an RJ9 pigtail breakout, no board. Fluke 101, Jesverty supply at 3.3 V,
  # a 1% 2k2 measured at 2174 ohm and used at that value.
  # Evidence: discovery/evidence/2026-09-22-handset-capsule-polarity-and-current.txt
  headline: >-
    YELLOW and BLACK are the transmitter, YELLOW POSITIVE. RED and GREEN are
    the receiver. The electret draws 192 uA at 3.3 V through 2k2.

  🔴 the_colour_map_which_is_what_loa_needs_to_build_the_cable:
    transmitter_mic:
      yellow: "POSITIVE, the JFET drain. Takes the bias, goes to the J18 channel pin"
      black:  "NEGATIVE, the source. Goes to J18 pin 3, MIC_RTN"
    receiver_earpiece:
      red_and_green: "the inner pair. Not polarity sensitive, see below"
    why_it_had_to_be_measured: >-
      The 2026-08-25 record established that THE OUTER PAIR is the transmitter
      but never wrote down which conductors that meant, and cord colours in a
      4P4C handset lead denote POSITION, not polarity. There is no
      red-is-positive convention available here to fall back on. Wiring the
      electret backwards gives a silent microphone.

  resistance_both_directions:
    inner_red_green:  {both_ways_kohm: 0.821, symmetric: true}
    outer_yellow_black: {red_probe_on_yellow_kohm: 1.798, red_probe_on_black_kohm: 1.056}
    what_is_new: >-
      THE INNER PAIR IS SYMMETRIC, 0.821 k in both directions. Only one
      direction was taken in 2026-08-25, so nothing had ruled out a second
      semiconductor on that pair. Symmetric means passive, which is what a
      magnetic receiver looks like.
    corroboration: >-
      Against the 2026-08-25 jack readings, inner 0.824 k and outer 1.054 k:
      0.4% and 0.2% apart, two riggings a month apart. It also settles the
      unit, since both sets are kilohms.

  polarity_by_biasing_it:
    rig: "3.3 V -> 2174 ohm -> capsule -> 0 V, Fluke reading the drain to ground. This is R51's circuit."
    yellow_on_the_resistor: {drain_V: 2.882, across_R_V: 0.418, current_uA: 192.3, capsule_as_R_kohm: 14.99}
    black_on_the_resistor:  {drain_V: 0.683, across_R_V: 2.617, current_uA: 1203.8, capsule_as_R_ohm: 567}
    verdict: "🔴 YELLOW IS POSITIVE."
    🔴 why_it_is_unambiguous: >-
      NOT MERELY "ONE IS LOWER". 0.683 V AT 1.2 mA IS A SILICON JUNCTION
      FORWARD DROP: reversed, the capsule is not operating at all, it is a
      diode. 192 uA meanwhile is textbook electret bias current against a
      usual quoted range of 100-500 uA.

      It agrees with the resistance test independently: the red probe on
      YELLOW gave the HIGHER reading, which predicts yellow is the drain. Two
      methods, same answer. And it reconciles internally, since a junction's
      apparent resistance falls as current rises: 1.056 k at the meter's test
      current, 567 ohm at 1.2 mA.

  🔴 the_operating_current_replaces_a_placeholder:
    measured_uA: 192
    budgeted_uA: 1500
    factor: "7.8x too high"
    what_was_wrong_with_the_old_figure: >-
      values.md carried 1.5 mA per channel, which is exactly 3.3 V / 2k2: the
      current with THE CAPSULE TREATED AS A SHORT. It is not a short. It
      presents about 15 kohm at its operating point, so the 2k2 is only 13% of
      the loop and drops 0.42 V of the 3.3 V.
    for_the_pair: "384 uA rather than 3.0 mA on 3V3A"

  🔴 this_record_said_it_needed_the_board_AND_THAT_WAS_WRONG: >-
    `what_would_close_it` below reads "Voltage across R51 with the board
    powered; I = V(R51) / 2200. Needs the boards, so it is not a bench item."

    IT IS A BENCH ITEM. 3.3 V through a 2k2 into the real capsule IS R51's
    circuit, and it was measured with no board in the room. The claim was
    never examined, it was assumed because the quantity was named after a
    board reference designator. WORTH KEEPING AS A PATTERN: naming a
    measurement after the part it will eventually sit next to is what made it
    look like it needed that part.

  a_lever_for_mic_gain_budget_now_that_the_current_is_known: >-
    An electret's signal is developed ACROSS its load resistor, so output
    scales with R51 while the JFET stays in saturation. With 192 uA known,
    R51 can be sized deliberately rather than guessed:

        2174   drop 0.42 V   drain 2.88 V   reference, as fitted
        4k7    drop 0.90 V   drain 2.40 V   ~2.2x   (+6.7 dB)
        10k    drop 1.92 V   drain 1.38 V   ~4.6x   (+13.3 dB)
        12k    drop 2.31 V   drain 0.99 V   ~5.5x, drain getting tight

    SO ROUGHLY 13 dB IS AVAILABLE FROM ONE 0603. NOT A RECOMMENDATION:
    `mic-gain-budget` is still unverified and nothing says more gain is
    needed. Recorded because it is only calculable now, and because it is
    cheaper than any other way of finding 13 dB. It assumes the JFET stays in
    saturation as the drain comes down, which is supported at 2.88 V and would
    want re-measuring at any new operating point.

conclusion: ELECTRET

why:
  - >-
    THE POLARITY DEPENDENCE IS THE PROOF, not the magnitude. 1.76k one way and
    1.05k the other means a semiconductor junction. A resistor reads the same
    both ways and so does a coil, so the element is neither carbon nor dynamic
    regardless of what band the numbers fall in.
  - >-
    Steady with no jump when tapped independently rules out carbon, which is
    docs/mic-configurations.md's own tell.

documentation_defect:
  where: docs/mic-configurations.md, "First, identify the capsule"
  says: "open circuit -> ELECTRET"
  problem: >-
    True only of a BARE electret element, which is a capacitor. Nearly every
    practical capsule is a two-terminal package with an integral JFET and reads
    a finite kilohm value that changes with probe polarity. This capsule matches
    none of the tree's three branches, so a reader following it would conclude
    "not any of these" rather than "electret".
  fix: >-
    Add a fourth branch: "1-3 kohm, differs when the probes are reversed ->
    ELECTRET with integral FET".
  applied: >-
    2026-08-25. docs/mic-configurations.md now leads with "measure it both ways
    round", carries the fourth branch, and states the general form: a reading
    that changes with probe polarity is a semiconductor, which settles the type
    on its own and does not depend on the magnitude landing in an expected band.
    The glue warning is included, since a partial contact reads high and high is
    the comfortable end of every threshold.

consequences:
  jumpers: >-
    JP1 on 1-2 (left) and JP4 on 1-2 (right), the electret legs, biased through
    R51/R53 at 2k2 from 3V3A. The x101 gain leg.
  carbon_record: >-
    carbon-capsule-DC-resistance is no longer a question about loa's phone. Its
    R52/R54 only carry capsule current with a jumper on the carbon position, and
    an electret never sits across them. That record stays open for any carbon
    capsule fitted later.
  values_md: >-
    The electret bias line in docs/values.md lists 1.5 mA per channel, which is
    exactly 3.3 V / 2k2, i.e. R51 with the capsule treated as a SHORT. The
    capsule is not a short, so that figure overstates the 3V3A load. It is NOT
    corrected to 831 uA or 1015 uA either: see below.

bias_current_is_bounded_not_measured:
  bounds_ua: {capsule_as_short: 1500, at_1050_ohm: 1015, at_1770_ohm: 831}
  why_none_of_these_is_the_answer: >-
    A JFET is not a fixed resistor. Its DC operating point at 3.3 V is not what
    an ohmmeter probes at roughly 0.3 V, so substituting a meter reading for an
    operating resistance produces a number that looks derived and is not
    measured. That is conventions rule 10 exactly.
  what_would_close_it: >-
    ✅ CLOSED 2026-09-22, AND THE SECOND SENTENCE WAS WRONG. Voltage across
    R51 with the board powered; I = V(R51) / 2200. "Needs the boards, so it is
    not a bench item" is false: 3.3 V through a 2k2 into the real capsule IS
    that circuit, and it was measured with no board. Answer: 192 uA, not the
    1.5 mA the table carried. See `measured_2026_09_22`.

evidence:
  - "2026-09-22: RJ9 COLOUR MAP AND TRANSMITTER POLARITY SETTLED, and the
     electret's real operating current measured. OUTER pair is YELLOW and
     BLACK, the transmitter, with YELLOW POSITIVE; INNER pair is RED and
     GREEN, the receiver, symmetric at 0.821 k both ways. Polarity established
     functionally by biasing through a measured 2174 ohm from 3.3 V: yellow on
     the resistor gives a 2.882 V drain at 192 uA, black gives 0.683 V at
     1.2 mA, which is a junction forward drop and not an operating point. The
     192 uA replaces values.md's derived 1.5 mA, which assumed the capsule was
     a short and was 7.8x too high. Corroborates the 2026-08-25 jack readings
     to 0.4% and 0.2%
     (2026-09-22-handset-capsule-polarity-and-current.txt)"
  - "2026-08-25: transmitter 1.75-1.77k forward, 1.05-1.06k reversed, steady, measured at the capsule out of circuit; receiver 145.3 ohm; identified ELECTRET by polarity dependence (2026-08-25-handset-capsule-identification.txt)"

last_verified: 2026-09-22

notes: >-
  WHAT THIS DOES NOT CLOSE. mic-gain-budget stays unverified. Identification
  fixes WHICH gain range applies (56-200x for an electret) but not whether the
  board's x101 lands inside it, because that rests on the capsule's OUTPUT LEVEL
  at close-talk distance, which is still unmeasured and is an assumed 94 dB SPL.

  THE GLUE IS WORTH REMEMBERING. The capsule terminals were covered in hot-melt
  glue and the first attempts probed through it. Hot glue is an insulator, so a
  partial contact reads high, and high is the comfortable end of every threshold
  in carbon-capsule-DC-resistance. Had this been a carbon capsule, probing
  through glue could have shown a safe-looking value for a part that was not
  safe. Clean the terminals before trusting a reading.
