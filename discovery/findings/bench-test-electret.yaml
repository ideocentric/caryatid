id: bench-test-electret
kind: other
source_claim: >-
  That the electret bought for bench testing can be trusted as a known-good
  reference when exercising caryatid's mic front end at bring-up Stage 8.
source_ref: >-
  Matt, 2026-09-05: "This is the electret I purchased for base testing",
  Amazon B0FRLZLH2G. Reported as two terminals with red and black pigtails.
resource: >-
  The bench test electret capsule, against caryatid's mic front end
  (R51/R53 2k2 bias from 3V3A, JP1/JP4, U4 at x101, J18)
status: confirmed      # 2026-09-23. Small capsule characterised as far as a bench can. See what_this_does_NOT_establish.

what_is_known:
  terminals: 2
  leads: "red and black pigtails"
  type_implied: >-
    A BARE TWO-TERMINAL CAPSULE, which is the correct article. caryatid's front
    end biases a capsule through R51/R53 at 2k2 from 3V3A and expects exactly
    this. A three-or-more-pin breakout with its own amplifier would have been
    the wrong part for this input and is not what arrived.
  listing_not_read: >-
    Amazon returned HTTP 500 on B0FRLZLH2G, twice. Sensitivity, impedance,
    operating voltage and current draw are all UNREAD. Nothing about this part
    is established beyond the terminal count and the lead colours, both of
    which came from Matt looking at it.

🔴 THERE_ARE_TWO_CAPSULES_NOT_ONE:
  # The rest of this record was written assuming one article.
  small_with_pigtails: "Amazon B0FRLZLH2G. THE ONE THIS RECORD DESCRIBES, and the reference."
  large_no_leads: >-
    uxcell B01F5592EO, two pads, CONFIRMED by Matt 2026-09-23. ⚠️ THIS RECORD
    SAID "DO NOT BUY IT". It was bought anyway.
  the_verdict_was_not_wrong: >-
    Its reasoning stands untouched: both are bare two-terminal electrets,
    identical on the axis that decides correctness, and PIGTAILS BEAT PADS ON A
    BENCH. The small one remains the reference and the large one needs leads
    soldered before it is usable at all.
  one_thing_the_verdict_did_not_anticipate: >-
    A SECOND INDEPENDENT ARTICLE IS USEFUL. Swapping capsules at Stage 8
    separates a board fault from a capsule fault, which one capsule cannot do.
    That is a reason to own it, not a reason the advice was wrong.

measured_2026_09_23:
  # Fluke 101, Jesverty supply, a 2k2 MEASURED at 2174 ohm. No board.
  # Evidence: discovery/evidence/2026-09-23-bench-electret-characterisation.txt

  test_A_resistance_both_directions:
    small_with_leads: {A1_red_probe_on_red: "1.397 k", A2: "1.154 k", ratio: 1.21}
    large_uxcell:     {A1: "1.286 k", A2: "0.828 k", ratio: 1.55}
    both_pass: >-
      Finite kilohms, clearly asymmetric. The asymmetry IS the built-in JFET and
      settles the type on its own without the magnitudes having to land in any
      expected band. Neither is dynamic nor carbon.
    ⚠️ the_large_capsule_readings_are_UNATTRIBUTED: >-
      It has no colour and no longer lead, so 1.286 and 0.828 are recorded
      WITHOUT knowing which pad the red probe was on. The can-bond check below
      would fix it.

  test_B_bias_small_capsule_red_at_node_B:
    rig: "3.30 V CV through 2174 ohm. This is R51's circuit exactly."
    drain_V: 2.558
    across_R_V: 0.738
    current_uA: 339
    total_V: 3.301        # CV held
    verdict: "🔴 RED IS POSITIVE."
    🔴 one_reading_settles_it_and_the_reverse_was_not_needed: >-
      A FORWARD-BIASED JUNCTION AT 339 uA WOULD SIT NEAR 0.6 V, NOT 2.558 V.
      There is no reading of this but a correctly biased JFET. The handset
      needed its reverse taken because the failure mode there was a 0.683 V
      junction drop that had to be seen; here the working orientation was hit
      first and is unambiguous alone.

  the_resistance_test_predicted_the_polarity_TWO_FOR_TWO:
    handset:      {meter_red_on: yellow, higher: "1.798 k", positive: yellow}
    bench_small:  {meter_red_on: red,    higher: "1.397 k", positive: red}
    rule: >-
      On these two parts THE METER'S RED PROBE ON THE POSITIVE TERMINAL GIVES
      THE HIGHER RESISTANCE, each confirmed functionally afterwards.
    ⚠️ TWO_SAMPLES_IS_NOT_A_LAW: >-
      It is a prior that has paid off twice, recorded with its sample size. The
      large capsule would be a third test of it.

  compared_with_the_capsule_that_actually_ships:
    handset:     {current_uA: 192, drain_V: 2.882, effective_R: "15.0 k"}
    bench_small: {current_uA: 339, drain_V: 2.558, effective_R: "7.5 k"}
    note: >-
      The bench article draws 1.8x the handset's. Both are healthy operating
      points in the same rig, which is a check ON THE RIG: two independent
      capsules landing where electrets should.
    🔴 339_uA_DOES_NOT_GO_IN_values_md: >-
      That budget line is 192 uA because THE HANDSET CAPSULE IS WHAT SHIPS. The
      bench electret never leaves the bench. Putting its current in the power
      budget would be the same class of error as a datasheet figure quoted at
      the wrong condition.

  large_capsule_polarity_IDENTIFIED_BUT_NOT_MEASURED:
    observation: "Matt, by eye: ONE PAD HAS METAL LEGS RUNNING TO THE CAPSULE BODY."
    what_that_is: >-
      THE CAN BOND, AND THAT PAD IS NEGATIVE. On a bare electret the back is a
      PCB disc with two pads; the can's rim is crimped onto one of them and the
      other sits inside an isolating gap as the drain.
    ⚠️ still_only_an_observation: >-
      NOT CONFIRMED WITH THE METER. Probe each pad to the can rim: the legged
      one should read near 0 ohm and the other open. Ten seconds, and it would
      also ATTRIBUTE the Test A readings above.
    prediction_if_done: >-
      Meter red on the NON-LEGGED pad gives the HIGHER reading, 1.286 k, making
      the polarity rule three for three.
    not_biased_deliberately: >-
      It needs leads soldered before it is usable, and the small capsule is the
      better reference.

🔴 what_this_does_NOT_establish:
  not_established: >-
    THAT EITHER CAPSULE PRODUCES USABLE SIGNAL. That needs the board at Stage 8
    or a scope. The bench cannot answer it and no claim is made here.
  so_what_does_proved_mean: >-
    "PROVE THE TEST ARTICLE" means proved AS FAR AS A BENCH CAN: that it is
    genuinely an electret, which lead is positive BY MEASUREMENT rather than
    convention, its operating point in R51's own circuit, and a baseline so a
    later oddity can be told from a changed capsule. Four things, not five.

🔴 characterise_it_BEFORE_using_it_as_a_reference:
  why: >-
    THIS PART'S JOB IS TO TELL YOU WHETHER THE BOARD WORKS. An uncharacterised
    reference cannot do that. If Stage 8h reads nothing, an unmeasured capsule
    leaves three suspects: the board, the capsule, and the wiring. Measuring it
    first removes one, and it costs one minute.

    PROVE THE TEST ARTICLE, THEN USE IT TO PROVE THE BOARD. The order is not
    optional and it is the same discipline as Stage 5, which proves the Daisy
    Seed standalone before it goes near the socket.

  the_measurement: >-
    DC resistance across the two leads, BOTH POLARITIES, per the identification
    procedure in docs/mic-configurations.md.
  expect: >-
    A finite kilohm reading that DIFFERS BY DIRECTION. A two-terminal electret
    package has a JFET built in, and the asymmetry is the JFET. loa's handset
    transmitter measured 1.75-1.77 kohm one way and 1.05-1.06 kohm reversed
    (`loa-handset-capsule`, confirmed 2026-08-25), and this capsule should show
    the same shape though not necessarily the same numbers.
  what_it_settles:
    - "That it is genuinely an electret and not something else in a similar can"
    - >-
      WHICH LEAD IS POSITIVE. Red is conventionally the drain, the positive
      side that takes the bias, and black the source or ground. Convention is
      not measurement. The polarity test says which is which, and an electret
      wired backwards does not work.
    - >-
      A baseline reading, so that if it ever behaves oddly later you can tell
      a changed capsule from a changed board.

how_it_wires_for_the_test:
  # From docs/mic-configurations.md and docs/connectors.md. J18 is JST-XH 3.
  j18: >-
    pin 1 is the LEFT input, pin 2 the RIGHT, pin 3 is MIC_RTN.
    All three are silkscreened on the board; read the board.
  capsule: >-
    RED to the channel pin being tested, which carries the bias down from
    R51 (left) or R53 (right). BLACK to J18 pin 3, MIC_RTN.
  jumpers_for_electret_LEFT:
    JP1: "1-2, bias through R51 2k2 from 3V3A"
    JP2: "1-2, output coupling C25 through to AUDIO_IN_L"
    JP3: "1-2, gain leg R58 1k, giving x101 or 40.1 dB"
  jumpers_for_electret_RIGHT:
    JP4: "1-2, bias through R53"
    JP5: "1-2, output coupling C29"
    JP6: "1-2, gain leg R62"
  note: >-
    A handset mic is mono and uses the left channel alone. For a BOARD test,
    run the capsule on each channel in turn: the point is to exercise both
    halves of U4, not to record anything.

🔴 J14_MUST_BE_LINKED_OR_NOTHING_WORKS:
  what: >-
    MIC_RTN IS NOT GROUNDED ON THE BOARD. It leaves on J18 pin 3, pairs with
    J14, and J14 is either a link to ground or a wire out to the hook switch's
    second pole. THE BOARD SHIPS WITH NEITHER.
  consequence: >-
    With J14 open the capsule has NO RETURN PATH. The front end is an open
    circuit, the capsule reads nothing, and it looks exactly like a dead U4, a
    dead capsule or a wrong jumper. Three wrong suspects for a missing link.
  do: >-
    LINK J14 BEFORE ANY MIC TEST. For loa this is the permanent answer anyway:
    the electret draws 1.5 mA per channel through the 2k2, 3 mA for the pair,
    which is not worth gating, so J14 is a link to ground rather than a run to
    the hook switch. See `loa-hook-switch`.
  and_it_is_a_gap_in_the_runbook: >-
    docs/bringup.md Stage 8h and 8i did not mention it. Corrected 2026-09-05.

an_alternative_was_offered_and_is_not_needed:
  # Matt, 2026-09-05: "I can get a different one as well", Amazon B01F5592EO.
  candidate: >-
    uxcell 8-pack, "Cylindrical Electret Condenser Microphone Pickup 85dB
    Through Hole Mini Electret Condenser Mic with 2 Pins 10x7mm". This listing
    DID load, unlike the other one.
  verdict: DO NOT BUY IT. The capsule in hand is the better bench article.
  why:
    - >-
      BOTH ARE BARE TWO-TERMINAL ELECTRETS. On the only axis that decides
      whether the part is correct for this input, they are identical.
    - >-
      PIGTAILS BEAT THROUGH-HOLE PINS ON A BENCH. The one in hand can be
      clipped or crimped to J18 as it is. The alternative has 2 pins and would
      need leads soldered on before it could be used at all.
    - >-
      ITS ONE EXTRA SPEC IS NOT USABLE. "85dB" is quoted with no reference
      condition. Electret sensitivity is normally given as dBV/Pa, typically
      -38 to -46, so an unqualified 85 dB is more likely an SNR figure or
      marketplace noise than a sensitivity. It looks like documentation and is
      not.
  the_deeper_reason: >-
    🔴 THE DATASHEET BARELY MATTERS FOR THIS PART'S JOB. It is not there to
    measure anything; it is there to answer "does the mic path carry a signal
    at all". Any bare electret does that. Sensitivity would matter if this
    capsule were setting the gain budget, and it is not: `mic-gain-budget`
    concerns LOA'S HANDSET CAPSULE, and a bench capsule of different
    sensitivity cannot settle it either way.

    So the missing specs on the part in hand are not a gap to be closed by
    buying a better documented one. They are irrelevant to the job, and the one
    thing that IS relevant, the polarity and resistance, is measured in a
    minute with the meter already on the bench.

evidence:
  - "2026-09-23: A7.5 COMPLETE for the small capsule, status unverified ->
     confirmed. TWO capsules in hand, not one: the small B0FRLZLH2G with
     pigtails that this record describes, and the uxcell B01F5592EO the record
     had said not to buy. Test A both pass, finite kilohms clearly asymmetric:
     small 1.397 k / 1.154 k, large 1.286 k / 0.828 k, the large one
     UNATTRIBUTED for want of any colour. Test B on the small capsule at 3.30 V
     through a measured 2174 ohm: drain 2.558 V, 339 uA, CV confirmed at 3.301.
     RED IS POSITIVE, settled by one reading since a junction at 339 uA would
     sit near 0.6 V not 2.558. The resistance test predicted it, now two for two
     across two parts. 339 uA is NOT a budget figure: the handset capsule at
     192 uA is what ships. Signal production is NOT established and needs Stage
     8 (2026-09-23-bench-electret-characterisation.txt)"
  - "2026-09-05: reported by Matt as TWO TERMINALS with red and black pigtails,
     which makes it a bare capsule and the correct article for caryatid's mic
     front end. The listing itself could not be read: Amazon returned HTTP 500
     on B0FRLZLH2G. Sensitivity, impedance, operating voltage and current are
     unread and no claim is made about any of them"

last_verified: 2026-09-23

notes: >-
  THE POINT OF THIS RECORD IS THAT A REFERENCE NEEDS VERIFYING TOO. It is easy
  to treat a bought part as known and the fabricated board as unknown, and then
  read every disagreement as a board fault. The board has been through DRC,
  netlist parity and a fab house. The capsule is an unbranded item off a
  marketplace whose listing would not even load.

  IT DOES NOT GATE ANYTHING BEFORE STAGE 8. Stages 0 through 7 do not involve
  it, so it can be characterised at any point before the audio sweep.
