#

#   C7 100u electrolytic -- RESOLVED as a conflict, still unsourced. The absonus
#     BOM as ordered (local/reference/bom.xls) shows C3337 is 220 uF in
#     CP_Elec_5x5.4, so power-sheet.md was wrong to map C7 to it and has been
#     corrected. C7 is 100 uF in CP_Elec_6.3x5.4 and still needs a part.
#
#   Generic passives -- every 0603 resistor and 0805 capacitor except the 0.1%
#     group. sourcing.md names C15401 for "10 kOhm 1% general" but the board
#     carries fifteen distinct resistor values and eight capacitor values, and
#     choosing Basic against Extended for each is a cost decision, not a
#     transcription.