# LCSC part numbers, keyed by what identifies the part on the board.
#
# WHY A FILE AND NOT A FIELD ON EACH SYMBOL
# Same reason pins.yaml exists: one reviewable source of truth that generators
# consume, rather than the same decision scattered across 180 symbol instances
# where it cannot be diffed. tools/fab_package.py joins this into the BOM.
#
# EVERY ENTRY HERE IS TRANSCRIBED FROM docs/sourcing.md, NOT LOOKED UP.
# Nothing in this file was invented. A part whose number is not written down in
# sourcing.md is absent here and is reported as a gap, because guessing an LCSC
# code has a real cost: it orders the wrong component.
#
# Match order: `ref` exactly, then `value` + `footprint`, then `footprint`.

